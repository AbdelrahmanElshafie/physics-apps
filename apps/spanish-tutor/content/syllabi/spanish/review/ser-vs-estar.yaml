  - id: se-donde-esta
    kind: sentence
    topicId: spanish:ser-vs-estar
    front: ¿Dónde está el libro?
    back: Where is the book? — the location question takes estar

  - id: se-esta-muerto
    kind: sentence
    topicId: spanish:ser-vs-estar
    front: Está muerto.
    back: He is dead — a state, so estar, however permanent
    exerciseIds: [se7]

  - id: se-la-fiesta-es-en-mi-casa
    kind: sentence
    topicId: spanish:ser-vs-estar
    front: La fiesta es en mi casa.
