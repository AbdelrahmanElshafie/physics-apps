  - id: se-aburrido-estar
    kind: word
    topicId: spanish:ser-vs-estar
    front: aburrido (with estar)
    back: bored — the state
    exerciseIds: [se5]

  - id: se-listo-ser
    kind: word
    topicId: spanish:ser-vs-estar
