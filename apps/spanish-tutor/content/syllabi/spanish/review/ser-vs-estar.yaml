# Review cards: the remaining forms of ser and estar, the classify-vs-describe contrasts, and the
# meaning-flipping adjectives. soy/eres/es live in the introducing-yourself deck, estoy/estás in
# how-are-you, and plain "está" in the stress deck — none is repeated here.

schemaVersion: 1
topic: ser-vs-estar
cards:
  - id: se-somos
    kind: word
    topicId: spanish:ser-vs-estar
    front: somos
    back: we are — from ser
    exerciseIds: [se3]

  - id: se-sois
    kind: word
    topicId: spanish:ser-vs-estar
    front: sois
    back: you (plural, Spain) are — from ser

  - id: se-son
    kind: word
    topicId: spanish:ser-vs-estar
    front: son
    back: they are; you (plural) are — from ser

  - id: se-estamos
    kind: word
    topicId: spanish:ser-vs-estar
    front: estamos
    back: we are — from estar; no accent

  - id: se-estais
    kind: word
    topicId: spanish:ser-vs-estar
    front: estáis
    back: you (plural, Spain) are — from estar

  - id: se-estan
    kind: word
    topicId: spanish:ser-vs-estar
    front: están
    back: they are; you (plural) are — from estar; the accent is required
    exerciseIds: [se4]

  - id: se-hoy
    kind: word
    topicId: spanish:ser-vs-estar
    front: hoy
    back: today

  - id: se-en-casa
