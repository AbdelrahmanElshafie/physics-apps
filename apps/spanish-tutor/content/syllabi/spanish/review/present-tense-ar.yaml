  - id: ar-un-poco-de
    kind: word
    topicId: spanish:present-tense-ar
    front: un poco de
    back: a little (of)

  - id: ar-escuela
    kind: word
    topicId: spanish:present-tense-ar
    front: la escuela
    back: the school

  - id: ar-hablas-espanol
    kind: sentence
    topicId: spanish:present-tense-ar
    front: ¿Hablas español?
    back: Do you speak Spanish? — statement order, question marks, rising voice
    exerciseIds: [ar7]

  - id: ar-no-hablan-ingles
    kind: sentence
    topicId: spanish:present-tense-ar
    front: No hablan inglés.
    back: They don't speak English — no goes straight before the verb
    exerciseIds: [ar8]

  - id: ar-estudio-espanol
    kind: sentence
    topicId: spanish:present-tense-ar
    front: Estudio español en Madrid.
    back: I study / am studying Spanish in Madrid
    exerciseIds: [ar2, ar9]
