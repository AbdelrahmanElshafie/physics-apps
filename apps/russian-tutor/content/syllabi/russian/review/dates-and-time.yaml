  - id: dt-dva-chasa
    kind: sentence
    topicId: russian:dates-and-time
    front: Сейчас два часа.
    frontPronunciation: Сейча́с два часа́.
    back: It's two o'clock — the 2–4 bracket, so час takes the genitive singular
    exerciseIds: [dt6]

  - id: dt-pyat-chasov
    kind: sentence
    topicId: russian:dates-and-time
    front: Сейчас пять часов.
    frontPronunciation: Сейча́с пять часо́в.
    back: It's five o'clock — the 5–20 bracket, so час takes the genitive plural
    exerciseIds: [dt7, dt8]
