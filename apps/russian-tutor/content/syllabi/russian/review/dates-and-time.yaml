  - id: dt-chas
    kind: word
    topicId: russian:dates-and-time
    front: час
    back: hour; o'clock
    exerciseIds: [dt5]

  - id: dt-kotoryy-chas
    kind: sentence
    topicId: russian:dates-and-time
    front: Который час?
    frontPronunciation: Кото́рый час?
