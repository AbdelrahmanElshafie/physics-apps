# Review cards: days, months, and the hour — the bracket rule applied to час.

schemaVersion: 1
topic: dates-and-time
cards:
  - id: dt-ponedelnik
    kind: word
    topicId: russian:dates-and-time
    front: понедельник
    frontPronunciation: понеде́льник
    back: Monday — day one of the Russian week
