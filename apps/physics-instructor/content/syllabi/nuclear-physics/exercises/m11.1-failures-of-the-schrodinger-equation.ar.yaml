# تمارين الموضوع 11.1 — أين تفشل معادلة شرودنجر.
#
# المجموعة A حجم حد p^4 الناقص؛ المجموعة B قوس زومرفيلد اللي شايل اعتماد j اللي معادلة شرودنجر
# مش قادرة تنتجه؛ المجموعة C بتتأكد من المفاهيم زي ما الدرس قالها بالظبط؛ المجموعة D هي التفكير،
# ودي بتيجي لي.
#
# الثوابت: alpha = 1/137.036، Ry = 109737.3 cm^-1.

schemaVersion: 1
topic: m11.1-failures-of-the-schrodinger-equation
intro: >-
  أربعتاشر سؤال. المجموعتين A و B هما الرقمين اللي الدرس ده مبني عليهم؛ لو مسكتهم الباقي هيجي
  لوحده.

exercises:
  # ---- المجموعة A: حد p^4 الناقص ----
  - id: fail1
    set: A
    label: س١
    kind: numeric
    prompt: >-
      حد $p^4$ الناقص بيساوي كام في المية من الطاقة الحركية الرئيسية، لإلكترون 1s في الموليبدنم،
      $Z = 42$؟ اكتب أربع أرقام عشرية.
    check:
      type: numeric
      value: 2.3484
      tolerance: 0.005
    hint: المعادلة 11.7، بـ $v/c$ من الدرس الأول عند $n = 1$.
    solution: >-
      $(v/c)^2/4 = (0.3065)^2/4 = 0.02348$، أي $2.3484\%$. نفس الـ $(Z\alpha)^2$ اللي حددت كل
      مقياس في الدرس الأول، دلوقتي متقاسة كنسبة من الطاقة الحركية نفسها.

  - id: fail2
    set: A
    label: س٢
    kind: numeric
    prompt: >-
      احسب نفس النسبة للهيدروجين، $Z = 1$. اكتب أربع أرقام عشرية.
    check:
      type: numeric
      value: 0.0013
      tolerance: 0.0003
    solution: >-
      $(0.0073)^2/4 = 1.33 \times 10^{-5}$، أي $0.0013\%$ — حوالي ألف وتمنمية مرة أصغر من
      الموليبدنم، لأنها بتمشي كـ $Z^2$.

  - id: fail3
    set: A
    label: س٣
    kind: truefalse
    prompt: >-
      صح ولا غلط: حد $p^4$ الناقص بيصغر بالتدريج لحد الصفر مع $Z\alpha \to 0$، زي أي خطأ تقريب
      عادي.
    check: { type: exact, value: true }
    solution: >-
      صح — دي الغلطة «مسألة الدرجة». على عكس اعتماد $j$ الناقص في المجموعة B، مفيش حاجة معطوبة
      نوعياً هنا: الحد ده بس صغير لما $Z\alpha$ صغيرة، وبيكبر بالتدريج مع ما هي مش كده.

  - id: fail4
    set: A
    label: س٤
    kind: numeric
    prompt: >-
      أصغر عدد صحيح $Z$ عنده حد $p^4$ الناقص بيوصل لـ 10% من الطاقة الحركية الرئيسية (لإلكترون
      1s) بيساوي كام؟
    check:
      type: numeric
      value: 87
      tolerance: 0.5
    hint: حلّ $(Z\alpha)^2/4 = 0.10$ عشان تلاقي $Z$، وبعدين قرّب لفوق.
    solution: >-
      $(Z\alpha)^2 = 0.4 \Rightarrow Z\alpha = 0.6325 \Rightarrow Z = 86.7$، يعني $Z = 87$
      (الفرانسيوم) أول عدد صحيح بعدها. بعد النقطة دي «التصحيح الصغير» بقى عشر الطاقة اللي
      بيصححها.

  # ---- المجموعة B: قوس زومرفيلد ----
  - id: fail5
    set: B
    label: س٥
    kind: numeric
    prompt: >-
      احسب قوس زومرفيلد $n/(j+\tfrac12) - \tfrac34$ عند $n = 3$، $j = \tfrac12$.
    check:
      type: numeric
      value: 2.25
      tolerance: 0.001
    solution: $3/(0.5+0.5) - 0.75 = 3 - 0.75 = 2.25$.

  - id: fail6
    set: B
    label: س٦
    kind: numeric
    prompt: >-
      احسب نفس القوس عند $n = 3$، $j = \tfrac52$ — واحدة من الحالات اللي $\ell = 2$ بيسمح بيها
      عند $n=3$.
    check:
      type: numeric
      value: 0.25
      tolerance: 0.001
    solution: $3/(2.5+0.5) - 0.75 = 1 - 0.75 = 0.25$.

  - id: fail7
    set: B
    label: س٧
    kind: numeric
    prompt: >-
      باستخدام المعادلة 11.8، الانفصال بين $2p_{1/2}$ و $2p_{3/2}$ للزركونيوم، $Z = 40$، بوحدة
      cm$^{-1}$ بيساوي كام؟
    check:
      type: numeric
      value: 934986
      tolerance: 4000
    hint: دي نفس حسبة المعادلة 11.2، بس عند $Z$ مختلفة.
    solution: >-
      $Z^4\alpha^2\mathrm{Ry}/16 = 40^4 \times (1/137.036)^2 \times 109737.3 / 16 \approx
      934986\ \text{cm}^{-1}$ — بتطابق صف $9.35\times10^5$ في جدول الدرس الأول، لأنها نفس
      الصيغة.

  - id: fail8
    set: B
    label: س٨
    kind: latex
    prompt: >-
      اكتب قوس زومرفيلد بدلالة $n$ و $j$.
    scaffold: \frac{}{}-
    check:
      type: latex-equivalent
      value: '\frac{n}{j+\frac12}-\frac34'
      accept:
        - '\frac{n}{j+\frac{1}{2}}-\frac{3}{4}'
        - '\frac{n}{j+1/2}-\frac{3}{4}'
        - 'n/(j+1/2) - 3/4'
        - '\frac{n}{j+0.5}-0.75'
    solution: >-
      $n/(j+\tfrac12) - \tfrac34$. كل حاجة عن ازاي البنية الدقيقة بتعتمد على $j$ عايشة في التعبير
      ده لوحده — وهو الجزء اللي $H = p^2/2m + V$ مالوش طريقة يكتبه.

  # ---- المجموعة C: قراية الدرس زي ما هو ----
  - id: fail9
    set: C
    label: س٩
    kind: multichoice
    prompt: أنهي عدد كمي $H = p^2/2m + V$ مالوش طريقة يعتمد عليه، عند أي رتبة؟
    choices:
      - { id: n, label: $n$، العدد الكمي الرئيسي }
      - { id: l, label: $\ell$، الزخم الزاوي المداري }
      - { id: j, label: $j$، الزخم الزاوي الكلي }
      - { id: m, label: $m_\ell$، العدد الكمي المغناطيسي }
    check: { type: exact, value: j }
    solution: >-
      $j$. هو بيجمع الحركة المدارية مع السبين، والهاملتونيان ده مفيهوش سبين عند أي مرحلة — مش
      إغفال صغير، غلطة هيكلية.

  - id: fail10
    set: C
    label: س١٠
    kind: truefalse
    prompt: >-
      صح ولا غلط: الانحطاط الزيادة للهيدروجين في $\ell$ تحت شرودنجر + كولوم النقي هو نفسه دليل
      على إن المعادلة صحيحة نسبياً.
    check: { type: exact, value: false }
    solution: >-
      غلط. الانحطاط ده خاصية غريبة لتماثل مخفي بتاع جهد $1/r$ النقي — موجود في النظرية اللا نسبية
      الكاملة ومالوش أي علاقة بالنسبية. متلخبطش قطعة غير مرتبطة من أناقة الهيدروجين الرياضية بدليل
      على إن المعادلة نسبية.

  - id: fail11
    set: C
    label: س١١
    kind: numeric
    prompt: >-
      حد $p^4$ الناقص بيساوي كام في المية من الطاقة الحركية الرئيسية عند اليورانيوم، $Z=92$؟ اكتب
      تلات أرقام عشرية.
    check:
      type: numeric
      value: 11.268
      tolerance: 0.05
    solution: >-
      $(0.6714)^2/4 \approx 11.268\%$ — أكتر من عشر الطاقة الحركية، من حد «تصحيحي» واحد بس.

  # ---- المجموعة D: التفكير ----
  - id: fail12
    set: D
    label: س١٢
    kind: truefalse
    prompt: >-
      صح ولا غلط: إضافة تصحيح $p^4$ بإيدك لهاملتونيان شرودنجر هتنتج البنية الدقيقة الكاملة
      للهيدروجين.
    check: { type: exact, value: false }
    explain:
      required: true
      hint: حد p^4 برضه مفهوش j. ده بيسيب إيه ورا؟
    solution: >-
      غلط. حد $p^4$ تصحيح قياسي (scalar) للطاقة الحركية — بيزيح كل حالة عند نفس $n$ و $\ell$
      بنفس المقدار، بغض النظر عن $j$. هو بيقفل جزء من الفجوة الكمّية من المجموعة A، بس لسه مش
      قادر يفصل $2p_{1/2}$ عن $2p_{3/2}$، لأنه مالوش اعتماد على $j$ يدّيه. البنية الدقيقة
      الحقيقية محتاجة حد مغزلي-مداري كمان، وده محتاج السبين يكون موجود في المعادلة من الأساس —
      الغلطة التانية، لسه زي ما هي.

  - id: fail13
    set: D
    label: س١٣
    kind: text
    prompt: >-
      اشرح ليه الانحطاط الزيادة للهيدروجين في $\ell$ (الطاقة بتعتمد على $n$ بس) مش دليل، لوحده،
      على إن معادلة شرودنجر صحيحة نسبياً.
    check: { type: tutor }
    solution: >-
      الانحطاط ده جاي من تماثل مخفي لجهد كولوم النقي تحديداً (متجه شبيه برانج-لنز محفوظ، أبعد من
      اللي الزخم الزاوي لوحده هيدّيه)، وهو موجود في معادلة شرودنجر اللا نسبية الكاملة من غير أي
      نسبية داخلة في الموضوع خالص. بيقول حاجة أنيقة عن قوة $1/r$، مش حاجة صحيحة عن النسبية —
      المعادلة لسه ناقصها حد $p^4$ واعتماد $j$ بغض النظر عن عدد الحالات اللي بيشاركوا في نفس
      الطاقة.

  - id: fail14
    set: D
    label: س١٤
    kind: text
    prompt: >-
      اشرح بكلامك ليه مفيش حد تصحيحي مُضاف على $H = p^2/2m + V$ يقدر ينتج انزياح طاقة معتمد على
      $j$.
    check: { type: tutor }
    explain:
      hint: التصحيح ده لازم يتبني من إيه؟
    solution: >-
      أي حد تصحيحي هو دالة في المؤثرات (operators) الموجودة فعلاً في النظرية — الموضع والزخم وأي
      حاجة تانية المعادلة اتبنت بيها. $H = p^2/2m + V$ اتبنت بالكامل من الموضع والزخم؛ مفيهاش
      مؤثر سبين، و $j$ متعرّف كزخم زاوي مداري متجمع مع السبين. حد مفيهوش سبين مش يقدر يعتمد على
      كمية متعرّفة باستخدام السبين، مهما كانت طريقة بنائه. الحصول على اعتماد $j$ محتاج تغيير اللي
      المعادلة مبنية منه، مش ضبط معامل على اللي موجود فعلاً — وده بالظبط سبب إن الدرسين الجايين
      هيبنوا معادلات جديدة بدل ما يرقّعوا دي.
