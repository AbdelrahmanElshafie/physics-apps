# Symbol glossary. Drives <Symbol name="..." /> hover tooltips in lessons.
# Add entries as notation is introduced — an unknown name renders plainly rather than breaking.

schemaVersion: 1
entries:
  - name: hbar
    latex: \hbar
    term: Reduced Planck constant
    meaning: >-
      Planck's constant divided by 2 pi. The natural unit of angular momentum and action in
      quantum mechanics.
    seeAlso: [angular-momentum]

  - name: ket
    latex: \lvert \psi \rangle
    term: Ket
    meaning: >-
      A state vector. In a finite-dimensional space it is a column of complex numbers; the
      notation lets you name the state without committing to a basis.
    seeAlso: [bra, inner-product]

  - name: bra
    latex: \langle \phi \rvert
    term: Bra
    meaning: >-
      The dual of a ket: its conjugate transpose. Pairing a bra with a ket gives a number.
    seeAlso: [ket, inner-product]

  - name: inner-product
    latex: \langle \phi \vert \psi \rangle
    term: Inner product
    meaning: >-
      A complex number measuring the overlap of two states. Zero means orthogonal; one means
      identical (for normalised states).
    seeAlso: [bra, ket]

  - name: reals
    latex: \mathbb{R}
    term: Real numbers
    meaning: Ordinary numbers — integers, fractions, decimals, irrationals such as pi.
    seeAlso: [complex]

  - name: complex
    latex: \mathbb{C}
    term: Complex numbers
    meaning: >-
      Numbers of the form a + bi. Quantum mechanics requires them: amplitudes carry a phase,
      and phase is what produces interference.
    seeAlso: [reals]

  - name: basis
    latex: \{ \mathbf{e}_1, \ldots, \mathbf{e}_n \}
    term: Basis
    meaning: >-
      A minimal set of linearly independent vectors that spans the space. Every vector has
      exactly one expansion in a given basis.
    seeAlso: [span, dimension]

  - name: span
    latex: \operatorname{span}
    term: Span
    meaning: Every point reachable by linear combinations of a given set of vectors.
    seeAlso: [basis]

  - name: dimension
    latex: \dim V
    term: Dimension
    meaning: The number of vectors in a basis — how many independent directions the space has.
    seeAlso: [basis]

  - name: angular-momentum
    latex: \hat{L}
    term: Angular momentum operator
    meaning: >-
      Generates rotations. Its components do not commute, which is why angular momentum in
      quantum mechanics is quantised and directions cannot all be known at once.
    seeAlso: [hbar, commutator]

  - name: commutator
    latex: "[\\hat{A}, \\hat{B}]"
    term: Commutator
    meaning: >-
      The difference AB minus BA. When it vanishes the observables can be measured
      simultaneously; when it does not, they obey an uncertainty relation.
    seeAlso: [angular-momentum]

  - name: norm
    latex: \lVert v \rVert
    term: Norm
    meaning: >-
      The length of a vector, defined as the square root of its inner product with itself. A
      physical quantum state always has norm 1.
    seeAlso: [inner-product, normalised]

  - name: normalised
    latex: \lVert \psi \rVert = 1
    term: Normalised
    meaning: >-
      A vector of length one. Required of every physical state, because the squared norm is a
      total probability.
    seeAlso: [norm]

  - name: orthogonal
    latex: \langle u \vert v \rangle = 0
    term: Orthogonal
    meaning: >-
      Two vectors whose inner product vanishes — geometrically perpendicular, physically two
      perfectly distinguishable states.
    seeAlso: [inner-product, orthonormal]

  - name: orthonormal
    latex: \langle e_m \vert e_n \rangle = \delta_{mn}
    term: Orthonormal
    meaning: >-
      A set of vectors that are mutually orthogonal and each of length one. Expansion
      coefficients in such a basis are single inner products.
    seeAlso: [basis, orthogonal, completeness]

  - name: completeness
    latex: \sum_n \lvert e_n \rangle \langle e_n \rvert = \mathbb{1}
    term: Completeness relation
    meaning: >-
      Projecting onto every basis direction and summing the pieces returns the original vector —
      the basis misses no direction.
    seeAlso: [orthonormal, basis]

  - name: cauchy
    latex: \lim_{m,n \to \infty} \lVert v_m - v_n \rVert = 0
    term: Cauchy sequence
    meaning: >-
      A sequence whose terms eventually crowd arbitrarily close together. A space is complete
      when every such sequence converges to a point inside the space.
    seeAlso: [hilbert-space]

  - name: hilbert-space
    latex: \mathcal{H}
    term: Hilbert space
    meaning: >-
      A vector space with an inner product that is also complete. The setting of quantum
      mechanics — states are its vectors, and observables act on it as operators.
    seeAlso: [inner-product, cauchy, l2]

  - name: l2
    latex: L^2
    term: Square-integrable functions
    meaning: >-
      Functions whose total squared magnitude is finite. Exactly the wavefunctions that can be
      normalised, which is why this is the Hilbert space of quantum mechanics.
    seeAlso: [hilbert-space, normalised]

  - name: operator
    latex: \hat{A}
    term: Linear operator
    meaning: >-
      A rule taking a ket to a ket that respects superposition. The hat marks it as an
      instruction rather than a number.
    seeAlso: [adjoint, hermitian, unitary]

  - name: adjoint
    latex: \hat{A}^{\dagger}
    term: Adjoint (dagger)
    meaning: >-
      The partner operator defined by moving it across a bracket. In components, the conjugate
      transpose. Products reverse under it.
    seeAlso: [operator, hermitian]

  - name: hermitian
    latex: \hat{A}^{\dagger} = \hat{A}
    term: Hermitian operator
    meaning: >-
      An operator equal to its own adjoint. Its expectation values are real, which is why every
      observable is one.
    seeAlso: [adjoint, operator]

  - name: unitary
    latex: \hat{U}^{\dagger}\hat{U} = \mathbb{1}
    term: Unitary operator
    meaning: >-
      An operator whose adjoint is its inverse. It preserves every inner product, so probability
      is conserved — the form of time evolution and of every change of basis.
    seeAlso: [adjoint, operator]
