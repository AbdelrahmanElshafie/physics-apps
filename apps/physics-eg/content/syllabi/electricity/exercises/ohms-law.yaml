# تمارين: قانون أوم والمقاومة الكهربية
#
# مجموعة أ: R = V/I مباشرة وعكسيًا. مجموعة ب: قراءة الرسم البياني. مجموعة ج: مفاهيم.

schemaVersion: 1
topic: ohms-law
intro: تسعة أسئلة. الإجابات الرقمية والاختيارية بتتحقق فورًا.

exercises:
  - id: ol1
    set: أ
    label: س١
    kind: numeric
    prompt: مقاومة فرق الجهد على طرفيها 12 فولت، وشدة التيار المارة فيها 3 أمبير. احسب قيمة المقاومة.
    check: { type: numeric, value: 4, tolerance: 0.01 }
    solution: $R = V/I = 12/3 = 4\ \Omega$.

  - id: ol2
    set: أ
    label: س٢
    kind: numeric
    prompt: مقاومة قيمتها 5 أوم متصلة بمصدر جهد 20 فولت. احسب شدة التيار المارة فيها.
    check: { type: numeric, value: 4, tolerance: 0.01 }
    hint: اعكس القانون — I = V/R.
    solution: $I = V/R = 20/5 = 4\ A$.

  - id: ol3
    set: أ
    label: س٣
    kind: numeric
    prompt: مقاومة قيمتها 8 أوم يمر فيها تيار شدته 1.5 أمبير. احسب فرق الجهد على طرفيها.
    check: { type: numeric, value: 12, tolerance: 0.01 }
    hint: اعكس القانون — V = IR.
    solution: $V = IR = 1.5 \times 8 = 12\ V$.

  - id: ol4
    set: ب
    label: س٤
    kind: numeric
    prompt: >-
      الرسم البياني للعلاقة بين V و I لموصل أومي خط مستقيم من نقطة الأصل لنقطة عندها
      $I = 2\ \text{A}$ و $V = 8\ \text{V}$. احسب مقاومة الموصل.
    check: { type: numeric, value: 4, tolerance: 0.01 }
    solution: $R = \text{slope} = V/I = 8/2 = 4\ \Omega$.

  - id: ol5
    set: ب
    label: س٥
    kind: numeric
    prompt: >-
      مقاومة أومية ثابتة، فرق الجهد عليها 6 فولت والتيار المار فيها 2 أمبير. لو رفعنا الجهد لـ
      18 فولت، احسب شدة التيار الجديدة.
    check: { type: numeric, value: 6, tolerance: 0.01 }
    hint: احسب R الأول من القراءتين الأصليتين، وثبّتها.
    solution: >-
      $R = 6/2 = 3\ \Omega$ (ثابتة لأنها نفس المقاومة). عند $V = 18\ V$:
      $I = V/R = 18/3 = 6\ A$.

  - id: ol6
    set: ب
    label: س٦
    kind: numeric
    prompt: >-
      نفس المقاومة اللي في السؤال السابق (3 أوم)، لو قللنا التيار المار فيها لـ 0.5 أمبير،
      احسب فرق الجهد الجديد عليها.
    check: { type: numeric, value: 1.5, tolerance: 0.01 }
    solution: $V = IR = 0.5 \times 3 = 1.5\ V$.

  - id: ol7
    set: ج
    label: س٧
    kind: multichoice
    prompt: الموصل اللي بيتبع قانون أوم (علاقة خطية بين V و I عند ثبات درجة الحرارة) بنسميه...
    choices:
      - { id: ohmic, label: موصل أومي }
      - { id: nonohmic, label: موصل غير أومي }
      - { id: superconductor, label: موصل فائق }
      - { id: insulator, label: عازل }
    check: { type: exact, value: ohmic }
    solution: موصل أومي — ده تعريف المصطلح بالظبط.

  - id: ol8
    set: ج
    label: س٨
    kind: truefalse
    prompt: صح ولا غلط — قانون أوم قانون طبيعة عام بيصح مع كل المواد في كل الظروف، زي حفظ الطاقة.
    check: { type: exact, value: false }
    explain: { required: true, hint: فكّر في مثال اللمبة أو الدايود من الدرس. }
    solution: >-
      غلط. قانون أوم وصف تجريبي بيصح مع معظم المعادن عند درجة حرارة ثابتة، لكنه مش قانون عام —
      أجهزة زي فتيلة اللمبة أو الدايود مقاومتها بتتغيّر مع التيار، فالعلاقة عندهم مش خطية.

  - id: ol9
    set: ج
    label: س٩
    kind: text
    prompt: >-
      في دائرة قياس المقاومة، ليه لازم الأميتر يتوصّل على التوالي مع المقاومة المجهولة تحديدًا
      (مش على التوازي)، بينما الفولتميتر لازم يتوصّل على التوازي معاها؟
    check: { type: tutor }
    solution: >-
      الأميتر بيقيس شدة التيار، وده معناه إنه لازم يكون جزء من نفس المسار اللي التيار المطلوب
      قياسه بيمر فيه — وده بالظبط توصيل التوالي، حيث نفس التيار بيمر في كل عناصر الفرع.
      الفولتميتر بيقيس فرق الجهد بين طرفين، وده معناه إنه لازم يتوصّل بينهم مباشرة من غير ما
      يبقى جزء من مسار التيار الأساسي — وده توصيل التوازي، اللي بيحافظ على نفس فرق الجهد بين
      طرفي المقاومة وطرفي الفولتميتر.
