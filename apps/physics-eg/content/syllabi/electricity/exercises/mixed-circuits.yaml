# تمارين: اختزال الدوائر المركبة
#
# مجموعة أ: مثال الدرس الأول (توالي مع توازي). مجموعة ب: مثال الدرس الثاني (توالي جوه توازي).
# مجموعة ج: مفاهيم.

schemaVersion: 1
topic: mixed-circuits
intro: تسعة أسئلة. الإجابات الرقمية والاختيارية بتتحقق فورًا.

exercises:
  - id: mc1
    set: أ
    label: س١
    kind: numeric
    prompt: >-
      R₁ = 5 أوم على التوالي مع (R₂ = 10 أوم على التوازي مع R₃ = 10 أوم)، زي مثال الدرس الأول.
      احسب المقاومة الكلية للدائرة.
    check: { type: numeric, value: 10, tolerance: 0.01 }
    hint: اختزل مجموعة التوازي (R₂ مع R₃) الأول، وبعدين اجمعها مع R₁.
    solution: >-
      $R_{23} = (1/10 + 1/10)^{-1} = 5\ \Omega$، وبعدين $R_{total} = R_1 + R_{23} = 5 + 5 = 10\ \Omega$.

  - id: mc2
    set: أ
    label: س٢
    kind: numeric
    prompt: >-
      نفس دائرة السؤال السابق (المقاومة الكلية 10 أوم)، متصلة ببطارية 20 فولت. احسب شدة التيار
      الكلي الخارج من البطارية.
    check: { type: numeric, value: 2, tolerance: 0.01 }
    solution: $I = V/R_{total} = 20/10 = 2\ A$.

  - id: mc3
    set: أ
    label: س٣
    kind: numeric
    prompt: >-
      نفس الدائرة (I الكلي = 2 أمبير). احسب فرق الجهد على مجموعة R₂ و R₃ (قبل ما كانت مختزلة).
    check: { type: numeric, value: 10, tolerance: 0.01 }
    hint: التيار الكلي كله بيمر في R₂₃ (لأنها كانت على التوالي مع R₁) — استخدم قانون أوم عليها.
    solution: $V_{23} = I \times R_{23} = 2 \times 5 = 10\ V$.

  - id: mc4
    set: ب
    label: س٤
    kind: numeric
    prompt: >-
      (R₁ = 2 أوم على التوالي مع R₂ = 4 أوم) والمجموعة على التوازي مع R₃ = 6 أوم، زي مثال الدرس
      الثاني. احسب المقاومة الكلية للدائرة.
    check: { type: numeric, value: 3, tolerance: 0.01 }
    hint: اختزل R₁ مع R₂ على التوالي الأول، وبعدين حط الناتج على التوازي مع R₃.
    solution: >-
      $R_{12} = 2 + 4 = 6\ \Omega$، وبعدين $R_{total} = (1/6 + 1/6)^{-1} = 3\ \Omega$.

  - id: mc5
    set: ب
    label: س٥
    kind: numeric
    prompt: نفس دائرة السؤال السابق (المقاومة الكلية 3 أوم)، متصلة ببطارية 12 فولت. احسب شدة التيار الكلي.
    check: { type: numeric, value: 4, tolerance: 0.01 }
    solution: $I = V/R_{total} = 12/3 = 4\ A$.

  - id: mc6
    set: ب
    label: س٦
    kind: numeric
    prompt: >-
      نفس الدائرة. احسب فرق الجهد على R₁ بالذات (اللي قيمته 2 أوم، جوه الفرع اللي فيه R₁ و R₂
      على التوالي).
    check: { type: numeric, value: 4, tolerance: 0.01 }
    hint: >-
      الفرع اللي فيه R₁ و R₂ على التوازي مع R₃، فناخد فرق الجهد الكلي (12V) ونحسب تيار الفرع الأول،
      وبعدين نستخدمه على R₁ لوحدها.
    solution: >-
      $I_{12} = V/R_{12} = 12/6 = 2\ A$، وبعدين $V_1 = I_{12} \times R_1 = 2 \times 2 = 4\ V$.

  - id: mc7
    set: ج
    label: س٧
    kind: multichoice
    prompt: أول خطوة في اختزال أي دائرة مركبة هي...
    choices:
      - { id: whole, label: تطبيق قانون أوم على الدائرة كلها فورًا }
      - { id: innermost, label: تحديد أصغر مجموعة توالي بحت أو توازي بحت، واختزالها الأول }
      - { id: biggest, label: تحديد أكبر مقاومة في الدائرة والتركيز عليها }
      - { id: guess, label: تخمين التيار الكلي وبعدين التأكد منه }
    check: { type: exact, value: innermost }
    solution: >-
      تحديد أصغر مجموعة توالي بحت أو توازي بحت، واختزالها الأول — عشان تقدر تكرر نفس الخطوة على
      دائرة أبسط في كل مرة لغاية ما توصل لمقاومة واحدة.

  - id: mc8
    set: ج
    label: س٨
    kind: truefalse
    prompt: >-
      صح ولا غلط — بمجرد ما تختزل مجموعة مقاومات لمقاومة مكافئة واحدة، تفاصيل التيار وفرق الجهد
      جوه المجموعة الأصلية بتضيع للأبد ومينفعش تعرفها تاني.
    check: { type: exact, value: false }
    explain: { required: true, hint: فكّر في خطوة "الرجوع للخلف" في طريقة الاختزال. }
    solution: >-
      غلط. التيار أو فرق الجهد اللي بتحسبه على المقاومة المكافئة هو بالظبط نفس القيمة اللي كانت
      داخل المجموعة الأصلية قبل الاختزال — فتقدر ترجع بيه للخلف وتوزّعه على الفروع الأصلية باستخدام
      نفس قوانين التوالي والتوازي.

  - id: mc9
    set: ج
    label: س٩
    kind: text
    prompt: >-
      اشرح بخطواتك إزاي ترجع من التيار الكلي في دائرة مختزلة لحد ما توصل لتيار كل فرع فردي في
      دائرة توالي-جوه-توازي (زي مثال الدرس الأول).
    check: { type: tutor }
    solution: >-
      أول حاجة، بما إن المقاومة المكافئة للتوازي كانت على التوالي مع باقي الدائرة، فالتيار الكلي
      اللي حسبناه بيمر بالكامل في المقاومة المكافئة دي. بعد كده، بما إنها كانت أصلاً مقاومتين على
      التوازي، فنفس التيار ده بيحدد فرق الجهد عليها (V = I × R المكافئة)، وفرق الجهد ده هو نفسه
      اللي كان على كل فرع من الفرعين الأصليين. وأخيرًا، نستخدم فرق الجهد ده مع قانون أوم على كل
      مقاومة فردية عشان نلاقي تيارها هي بالذات.
