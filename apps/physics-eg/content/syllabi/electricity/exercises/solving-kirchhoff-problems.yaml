# تمارين: خطوات حل مسائل كيرشوف خطوة بخطوة
#
# مجموعة أ: دائرة مشابهة لمثال الدرس، بمقاومة R₃ مختلفة. مجموعة ب: تحقق من كيرشوف الأول على
# نفس دائرة الجسر مش المتّزنة اللي في الدرس. مجموعة ج: مفاهيم.

schemaVersion: 1
topic: solving-kirchhoff-problems
intro: تسعة أسئلة. الإجابات الرقمية والاختيارية بتتحقق فورًا.

exercises:
  - id: skp1
    set: أ
    label: س١
    kind: numeric
    prompt: >-
      دائرة زي مثال الدرس (خليتان بتغذّوا مقاومة مشتركة R₃)، لكن هنا EMF الأولى 8 فولت ومقاومتها
      الداخلية 1 أوم، EMF التانية 7 فولت ومقاومتها الداخلية 1 أوم، وR₃ = 1 أوم (بدل 2 أوم). احسب I₁.
    check: { type: numeric, value: 3, tolerance: 0.01 }
    hint: نفس خطوات الدرس بالظبط — افترض الاتجاهات، طبّق كيرشوف الأول والتاني، وحل المعادلتين مع بعض.
    solution: >-
      $I_3 = I_1+I_2$. المعادلتان: $8 = 2I_1+I_2$ و$7 = I_1+2I_2$. حلّهم مع بعض يدّي $I_1 = 3\ A$.

  - id: skp2
    set: أ
    label: س٢
    kind: numeric
    prompt: نفس الدائرة. احسب I₂.
    check: { type: numeric, value: 2, tolerance: 0.01 }
    solution: من نفس النظام، $I_2 = 2\ A$.

  - id: skp3
    set: أ
    label: س٣
    kind: numeric
    prompt: نفس الدائرة. احسب I₃، باستخدام كيرشوف الأول.
    check: { type: numeric, value: 5, tolerance: 0.01 }
    solution: $I_3 = I_1 + I_2 = 3 + 2 = 5\ A$.

  - id: skp4
    set: ب
    label: س٤
    kind: numeric
    prompt: >-
      في دائرة الجسر مش المتّزنة (زي مثال الدرس)، I في R₁ = 5/11 أمبير وI في R₂ = 3/11 أمبير (كلاهما
      خارج من نقطة A). احسب مجموعهم — المفروض يساوي التيار الكلي الخارج من البطارية.
    check: { type: numeric, value: 0.727, tolerance: 0.01 }
    solution: $5/11 + 3/11 = 8/11 \approx 0.727\ A$ — نفس التيار الكلي المذكور في الدرس.

  - id: skp5
    set: ب
    label: س٥
    kind: numeric
    prompt: >-
      نفس الدائرة، عند نقطة D: I في R₃ = 3/11 أمبير وI في R₄ = 5/11 أمبير (كلاهما داخل في D). احسب
      مجموعهم.
    check: { type: numeric, value: 0.727, tolerance: 0.01 }
    hint: المفروض يساوي نفس التيار الكلي اللي حسبته في السؤال السابق — كيرشوف الأول بيتحقق عند D برضه.
    solution: $3/11 + 5/11 = 8/11 \approx 0.727\ A$ — نفس القيمة بالظبط، زي ما كيرشوف الأول بيتطلب.

  - id: skp6
    set: ب
    label: س٦
    kind: numeric
    prompt: >-
      عند نقطة B: التيار الداخل من R₁ هو 5/11 أمبير. الخارج منها فرعان: R₃ (3/11 أمبير) والجسر R₅
      (2/11 أمبير). تحقّق من كيرشوف الأول بحساب مجموع الخارج.
    check: { type: numeric, value: 0.4545, tolerance: 0.01 }
    solution: >-
      $3/11 + 2/11 = 5/11 \approx 0.4545\ A$ — نفس التيار الداخل (5/11 أمبير) بالظبط، فكيرشوف
      الأول متحقق عند B كمان.

  - id: skp7
    set: ج
    label: س٧
    kind: multichoice
    prompt: >-
      دائرة معقّدة فيها N فرع مجهول شدة التيار. عدد المعادلات الكلي اللي محتاجها من كيرشوف الأول
      والتاني مع بعض عشان تحل الدائرة بيساوي...
    choices:
      - { id: n, label: N بالظبط (عدد المجهولات نفسه) }
      - { id: n_minus_1, label: N - 1 }
      - { id: n_plus_1, label: N + 1 }
      - { id: two, label: اتنين بس مهما كان N }
    check: { type: exact, value: n }
    solution: >-
      N بالظبط — أي نظام معادلات خطية محتاج نفس عدد المعادلات وعدد المجهولات عشان يكون له حل واحد
      محدّد.

  - id: skp8
    set: ج
    label: س٨
    kind: truefalse
    prompt: صح ولا غلط — لو حليت معادلات كيرشوف ولقيت قيمة تيار سالبة لفرع معيّن، لازم ترجع تحل تاني لأنك أكيد غلطان.
    check: { type: exact, value: false }
    explain: { required: true, hint: إيه معنى الإشارة السالبة بالنسبة للاتجاه اللي افترضته؟ }
    solution: >-
      غلط. القيمة السالبة معناها إن التيار الحقيقي في الفرع ده بعكس الاتجاه اللي افترضته وقت
      الحل، لكن بنفس المقدار بالظبط — مش خطأ في الحسابات.

  - id: skp9
    set: ج
    label: س٩
    kind: text
    prompt: >-
      اشرح ليه دائرة الجسر مش المتّزنة (اللي فيها تيار حقيقي بيعدي في الجالفانومتر) مينفعش تتحل
      بشرط الاتزان اللي درسناه في درس دائرة الجسر، ولازم نستخدم قوانين كيرشوف كاملة بدالًا منه.
    check: { type: tutor }
    solution: >-
      شرط الاتزان ($R_1R_4 = R_2R_3$) كله مبني على افتراض إن تيار الجالفانومتر صفر من الأساس —
      لو الشرط ده متحقّقش، الافتراض ده غلط، وأي حساب مبني عليه هيكون غلط. لما الجسر مش متّزن، لازم
      نتعامل مع تيار الجالفانومتر كمجهول حقيقي زي باقي التيارات، ونستخدم كيرشوف الأول والتاني مع
      بعض عشان نحصل على عدد معادلات يكفي لحل كل المجهولات الخمسة، من غير أي افتراض مسبق عن أي
      فرع فيهم.
