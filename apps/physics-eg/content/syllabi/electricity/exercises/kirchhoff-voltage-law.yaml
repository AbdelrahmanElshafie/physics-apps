# تمارين: قانون كيرشوف الثاني (قانون الدائرة المغلقة)
#
# مجموعة أ: حلقة بخلية واحدة (زي مثال الدرس). مجموعة ب: حلقة بخليتين (زي درس توصيل الخلايا).
# مجموعة ج: مفاهيم.

schemaVersion: 1
topic: kirchhoff-voltage-law
intro: تسعة أسئلة. الإجابات الرقمية والاختيارية بتتحقق فورًا.

exercises:
  - id: kvl1
    set: أ
    label: س١
    kind: numeric
    prompt: >-
      حلقة فيها خلية EMF = 10 فولت (مقاومتها الداخلية 0.2 أوم) ومقاومتان على التوالي (1.8 أوم
      و3 أوم)، زي مثال الدرس. احسب شدة التيار في الحلقة.
    check: { type: numeric, value: 2, tolerance: 0.01 }
    solution: $10 - I(0.2 + 1.8 + 3) = 0 \Rightarrow I = 10/5 = 2\ A$.

  - id: kvl2
    set: أ
    label: س٢
    kind: numeric
    prompt: نفس الحلقة (I = 2 أمبير). احسب فرق الجهد (الهبوط) على المقاومة 3 أوم بالذات.
    check: { type: numeric, value: 6, tolerance: 0.01 }
    solution: $V = IR = 2 \times 3 = 6\ V$.

  - id: kvl3
    set: أ
    label: س٣
    kind: numeric
    prompt: نفس الحلقة. احسب مجموع كل هبوطات الجهد (على المقاومة الداخلية والمقاومتين الخارجيتين مع بعض)، وقارنه بالـEMF.
    check: { type: numeric, value: 10, tolerance: 0.01 }
    hint: قانون كيرشوف الثاني بيقول إن المجموع ده لازم يساوي الـEMF بالظبط.
    solution: >-
      $I(r + R_1 + R_2) = 2 \times (0.2+1.8+3) = 2 \times 5 = 10\ V$ — يساوي الـEMF بالظبط، زي ما
      كيرشوف بيقول.

  - id: kvl4
    set: ب
    label: س٤
    kind: numeric
    prompt: >-
      حلقة فيها خليتان بقطبية متفقة (6 فولت و3 فولت، كل واحدة مقاومتها الداخلية 0.5 أوم) ومقاومة
      خارجية 3.5 أوم، زي مثال درس توصيل الخلايا. احسب شدة التيار، باستخدام قانون كيرشوف الثاني.
    check: { type: numeric, value: 2, tolerance: 0.01 }
    solution: $6 + 3 - I(0.5+0.5+3.5) = 0 \Rightarrow I = 9/4.5 = 2\ A$.

  - id: kvl5
    set: ب
    label: س٥
    kind: numeric
    prompt: نفس الدائرة. احسب فرق الجهد (الهبوط) على المقاومة الخارجية.
    check: { type: numeric, value: 7, tolerance: 0.01 }
    solution: $V = IR = 2 \times 3.5 = 7\ V$.

  - id: kvl6
    set: ب
    label: س٦
    kind: numeric
    prompt: نفس الدائرة. احسب مجموع كل هبوطات الجهد في الحلقة، وقارنه بمجموع الـEMFs.
    check: { type: numeric, value: 9, tolerance: 0.01 }
    solution: >-
      $I(r_1+r_2+R) = 2 \times 4.5 = 9\ V$ — يساوي $\varepsilon_1 + \varepsilon_2 = 6+3=9\ V$
      بالظبط.

  - id: kvl7
    set: ج
    label: س٧
    kind: multichoice
    prompt: قانون كيرشوف الثاني (قانون الحلقة المغلقة) أساسه الفيزيائي هو...
    choices:
      - { id: energy_conservation, label: حفظ الطاقة — الجهد عند أي نقطة قيمة واحدة محدّدة }
      - { id: charge_conservation, label: حفظ الشحنة }
      - { id: newtons_third_law, label: قانون نيوتن الثالث }
      - { id: no_basis, label: مفيهوش أساس فيزيائي }
    check: { type: exact, value: energy_conservation }
    solution: >-
      حفظ الطاقة. لو رجعت لنفس النقطة بعد ما دورت حوالين الحلقة، الجهد عندها لازم يبقى نفسه، وإلا
      كانت نفس النقطة عندها قيمتين مختلفتين للجهد في نفس اللحظة.

  - id: kvl8
    set: ج
    label: س٨
    kind: truefalse
    prompt: صح ولا غلط — لو غيّرت اتجاه السير حوالين الحلقة (من مع عقارب الساعة لعكسها)، قيمة التيار اللي هتحسبها هتتغيّر.
    check: { type: exact, value: false }
    explain: { required: true, hint: فكّر في إيه اللي بيحصل لكل الإشارات لو قلبت اتجاه السير. }
    solution: >-
      غلط. قلب اتجاه السير بيقلب كل إشارة (صعود يبقى هبوط والعكس) بانتظام، وده زي ما تضرب المعادلة
      كلها في سالب واحد — الحل النهائي لـ I مبيتأثرش خالص.

  - id: kvl9
    set: ج
    label: س٩
    kind: text
    prompt: >-
      اشرح إزاي تقرر إن فرق الجهد عبر مقاومة معيّنة "هبوط" ولا "صعود" وانت ماشي حوالين حلقة، وإزاي
      تقرر إن خلية "صعود" ولا "هبوط".
    check: { type: tutor }
    solution: >-
      لازم تفترض اتجاه للتيار الأول. لو مشيت حوالين الحلقة في نفس اتجاه التيار المفترض ده وأنت
      عدّي على مقاومة، فرق الجهد عبرها بيبقى **هبوط** ($-IR$) لأن التيار بيفقد طاقة وهو عدّي فيها.
      لو مشيت عكس اتجاه التيار المفترض، بيبقى **صعود** ($+IR$). للخلية، القرار بيعتمد على اتجاه
      سيرك بالنسبة لقطبيتها: لو عدّيت من القطب السالب للموجب (في اتجاه سيرك)، ده **صعود** ($+\varepsilon$)،
      ولو عدّيت من الموجب للسالب بيبقى **هبوط** ($-\varepsilon$).
