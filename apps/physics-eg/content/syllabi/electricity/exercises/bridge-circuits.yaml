# تمارين: دوائر الجسر (وتستون)
#
# مجموعة أ: إيجاد مقاومة مجهولة من شرط الاتزان. مجموعة ب: التيارات في جسر متّزن. مجموعة ج: مفاهيم.

schemaVersion: 1
topic: bridge-circuits
intro: تسعة أسئلة. الإجابات الرقمية والاختيارية بتتحقق فورًا.

exercises:
  - id: bc1
    set: أ
    label: س١
    kind: numeric
    prompt: >-
      دائرة جسر متّزنة، R₁ = 6 أوم وR₂ = 18 أوم وR₃ = 8 أوم. احسب قيمة R₄ اللي بتخلي الجسر متّزن.
    check: { type: numeric, value: 24, tolerance: 0.01 }
    hint: استخدم شرط الاتزان R₁R₄ = R₂R₃.
    solution: $6 \times R_4 = 18 \times 8 = 144 \Rightarrow R_4 = 24\ \Omega$.

  - id: bc2
    set: أ
    label: س٢
    kind: numeric
    prompt: >-
      دائرة جسر متّزنة، R₁ = 15 أوم وR₂ = 5 أوم وR₄ = 12 أوم. احسب قيمة R₃ اللي بتخلي الجسر متّزن.
    check: { type: numeric, value: 36, tolerance: 0.01 }
    hint: نفس الشرط، بس دلوقتي المجهول هو R₃.
    solution: $15 \times 12 = 5 \times R_3 = 180 \Rightarrow R_3 = 36\ \Omega$.

  - id: bc3
    set: أ
    label: س٣
    kind: numeric
    prompt: دائرة جسر متّزنة، R₁ = 4 أوم وR₂ = 8 أوم وR₃ = 10 أوم. احسب قيمة R₄.
    check: { type: numeric, value: 20, tolerance: 0.01 }
    solution: $4 \times R_4 = 8 \times 10 = 80 \Rightarrow R_4 = 20\ \Omega$.

  - id: bc4
    set: ب
    label: س٤
    kind: numeric
    prompt: >-
      دائرة جسر متّزنة زي مثال الدرس (R₁ = 10 أوم، R₂ = 20 أوم على الفرع الأول)، متصلة ببطارية
      12 فولت. احسب شدة التيار في الفرع الأول (R₁ ثم R₂).
    check: { type: numeric, value: 0.4, tolerance: 0.01 }
    hint: بما إن الجسر متّزن، عامل كل فرع كأنه دائرة توالي بسيطة لوحدها.
    solution: $I_1 = V/(R_1 + R_2) = 12/30 = 0.4\ A$.

  - id: bc5
    set: ب
    label: س٥
    kind: numeric
    prompt: >-
      نفس الدائرة (R₃ = 5 أوم، R₄ = 10 أوم على الفرع التاني، بطارية 12 فولت). احسب شدة التيار في
      الفرع التاني.
    check: { type: numeric, value: 0.8, tolerance: 0.01 }
    solution: $I_2 = V/(R_3 + R_4) = 12/15 = 0.8\ A$.

  - id: bc6
    set: ب
    label: س٦
    kind: numeric
    prompt: نفس دائرة الجسر المتّزنة. احسب شدة التيار المار في الجالفانومتر (R₅) نفسه.
    check: { type: numeric, value: 0, tolerance: 0.001 }
    hint: ده بالظبط تعريف "الاتزان".
    solution: $I_5 = 0$ — ده بالظبط معنى إن الجسر متّزن.

  - id: bc7
    set: ج
    label: س٧
    kind: multichoice
    prompt: شرط اتزان جسر وتستون (بترقيم الدرس) هو...
    choices:
      - { id: correct, label: 'R₁R₄ = R₂R₃' }
      - { id: sum, label: 'R₁ + R₄ = R₂ + R₃' }
      - { id: wrong_ratio, label: 'R₁/R₄ = R₂×R₃' }
      - { id: all_equal, label: كل المقاومات الأربعة لازم تكون متساوية }
    check: { type: exact, value: correct }
    solution: 'R₁R₄ = R₂R₃ — حاصل ضرب كل مقاومتين متقابلتين لازم يتساووا.'

  - id: bc8
    set: ج
    label: س٨
    kind: truefalse
    prompt: >-
      صح ولا غلط — لو غيّرنا قيمة مقاومة الجالفانومتر نفسه (R₅) في جسر متّزن، من غير ما نلمس
      باقي المقاومات، الجسر هيختل (يبقى مش متّزن).
    check: { type: exact, value: false }
    explain: { required: true, hint: شرط الاتزان اتبنى أصلاً على افتراض إن I₅ = 0 — فين R₅ في المعادلة؟ }
    solution: >-
      غلط. شرط الاتزان (R₁R₄ = R₂R₃) متضمنش R₅ خالص، لأنه مبني على افتراض إن مفيش تيار بيمر فيها.
      طالما الأربع مقاومات التانية بتحقق الشرط، الجسر بيفضل متّزن أيًا كانت قيمة R₅.

  - id: bc9
    set: ج
    label: س٩
    kind: text
    prompt: >-
      ليه دائرة الجسر (لو مش متّزنة) مينفعش تتحل بقوانين التوالي والتوازي العادية اللي درسناها في
      الدرس اللي فات؟
    check: { type: tutor }
    solution: >-
      لأن مقاومة الجسر (R₅) واصلة بين نقطتين (B وC) مالهمش علاقة توالي أو توازي بسيطة مع باقي
      عناصر الدائرة — كل مقاومة في الدائرة مالهاش نفس النقطتين بالظبط مع أي مقاومة تانية (شرط
      التوازي)، ومفيش مسار واحد بس يجمعهم كلهم ورا بعض (شرط التوالي). الدائرة بقت شبكة حلقات
      متشابكة، ومحتاجة قواعد كيرشوف عشان تتحل في الحالة العامة — إلا لو كانت متّزنة، وهنا بس
      شرط الاتزان بيدّينا مخرج بسيط.
