# تمارين: توصيل المقاومات على التوالي
#
# مجموعة أ: المقاومة المكافئة والتيار. مجموعة ب: توزيع فرق الجهد. مجموعة ج: مفاهيم.

schemaVersion: 1
topic: series-resistors
intro: تسعة أسئلة. الإجابات الرقمية والاختيارية بتتحقق فورًا.

exercises:
  - id: sr1
    set: أ
    label: س١
    kind: numeric
    prompt: ثلاث مقاومات قيمتها 4 أوم و6 أوم و10 أوم متصلة على التوالي. احسب المقاومة المكافئة.
    check: { type: numeric, value: 20, tolerance: 0.01 }
    solution: $R_{eq} = R_1 + R_2 + R_3 = 4 + 6 + 10 = 20\ \Omega$.

  - id: sr2
    set: أ
    label: س٢
    kind: numeric
    prompt: >-
      المقاومات الثلاثة في السؤال السابق (المكافئة لها 20 أوم) متصلة ببطارية فرق جهدها 40 فولت.
      احسب شدة التيار المارة في الدائرة.
    check: { type: numeric, value: 2, tolerance: 0.01 }
    hint: استخدم قانون أوم على الدائرة كلها بالمقاومة المكافئة.
    solution: $I = V/R_{eq} = 40/20 = 2\ A$.

  - id: sr3
    set: أ
    label: س٣
    kind: numeric
    prompt: >-
      نفس دائرة السؤال السابق (I = 2 أمبير في كل الدائرة). احسب فرق الجهد على المقاومة اللي قيمتها
      6 أوم بالذات.
    check: { type: numeric, value: 12, tolerance: 0.01 }
    hint: نفس التيار بيمر في كل مقاومة على حدة — استخدم V = IR على المقاومة دي بس.
    solution: $V = IR = 2 \times 6 = 12\ V$.

  - id: sr4
    set: ب
    label: س٤
    kind: numeric
    prompt: >-
      ثلاث مقاومات على التوالي، فرق الجهد الكلي عليهم 20 فولت. لو فرق الجهد على أول مقاومتين كان
      6 فولت و9 فولت، احسب فرق الجهد على المقاومة التالتة.
    check: { type: numeric, value: 5, tolerance: 0.01 }
    hint: فرق الجهد الكلي هو مجموع الأنصبة — اطرح الاتنين المعروفين من الكلي.
    solution: $V_3 = V - V_1 - V_2 = 20 - 6 - 9 = 5\ V$.

  - id: sr5
    set: ب
    label: س٥
    kind: numeric
    prompt: >-
      ثلاث مقاومات 25 أوم و70 أوم و85 أوم على التوالي مع بطارية 45 فولت (زي مثال الدرس). احسب
      شدة التيار في الدائرة.
    check: { type: numeric, value: 0.25, tolerance: 0.001 }
    solution: >-
      $R_{eq} = 25 + 70 + 85 = 180\ \Omega$، وبعدين $I = V/R_{eq} = 45/180 = 0.25\ A$.

  - id: sr6
    set: ب
    label: س٦
    kind: numeric
    prompt: نفس دائرة السؤال السابق (I = 0.25 أمبير). احسب فرق الجهد على المقاومة 70 أوم بالذات.
    check: { type: numeric, value: 17.5, tolerance: 0.01 }
    solution: $V_2 = IR_2 = 0.25 \times 70 = 17.5\ V$.

  - id: sr7
    set: ج
    label: س٧
    kind: multichoice
    prompt: في توصيل التوالي، إيه اللي بيفضل ثابت (نفس القيمة) في كل عنصر بالدائرة؟
    choices:
      - { id: current, label: شدة التيار }
      - { id: voltage, label: فرق الجهد }
      - { id: resistance, label: المقاومة }
      - { id: power, label: القدرة الكهربية }
    check: { type: exact, value: current }
    solution: شدة التيار — لأن مفيش تفريعة تسمح لجزء من الشحنة ياخد طريق تاني.

  - id: sr8
    set: ج
    label: س٨
    kind: truefalse
    prompt: صح ولا غلط — إضافة مقاومة جديدة على التوالي في دائرة (بنفس البطارية) بتزوّد شدة التيار الكلي.
    check: { type: exact, value: false }
    explain: { required: true, hint: فكّر في العلاقة بين المقاومة المكافئة وشدة التيار عند ثبات فرق الجهد. }
    solution: >-
      غلط. إضافة مقاومة على التوالي بتزوّد المقاومة المكافئة $R_{eq}$، وبما إن فرق الجهد ثابت،
      فشدة التيار $I = V/R_{eq}$ بتقل، مش بتزيد.

  - id: sr9
    set: ج
    label: س٩
    kind: text
    prompt: >-
      ليه لمبات الزينة القديمة (المتصلة على التوالي) كانت كلها بتطفى لو لمبة واحدة منها احترقت،
      بينما لمبات البيت العادية (المتصلة على التوازي) بتفضل شغالة؟
    check: { type: tutor }
    solution: >-
      في التوصيل على التوالي، كل العناصر على نفس المسار الوحيد للتيار — فلو أي عنصر اتقطع (زي لمبة
      احترقت)، الدائرة كلها بتنفتح ومفيش تيار يعدي في أي حتة، فكل اللمبات بتطفى مع بعض. في التوصيل
      على التوازي، كل لمبة على فرع مستقل ليه نفس فرق الجهد، فلو فرع اتقطع، الفروع التانية بتفضل
      متصلة بمصدر الجهد وبيكمل فيها تيار عادي.
