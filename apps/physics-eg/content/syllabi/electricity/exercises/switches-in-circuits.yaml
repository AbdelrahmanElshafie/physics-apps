# تمارين: أثر المفاتيح على الدائرة
#
# مجموعة أ: مفتاح على فرع من دائرة توازي. مجموعة ب: مفتاح تجاوز (بايباس) موازي لمقاومة.
# مجموعة ج: مفاهيم.

schemaVersion: 1
topic: switches-in-circuits
intro: تسعة أسئلة. الإجابات الرقمية والاختيارية بتتحقق فورًا.

exercises:
  - id: sw1
    set: أ
    label: س١
    kind: numeric
    prompt: >-
      فرعان على التوازي (R₁ = 6 أوم مع مفتاح S₁، وR₂ = 12 أوم مع مفتاح S₂)، بطارية 12 فولت،
      والاتنين مقفولين. احسب شدة التيار في فرع R₁.
    check: { type: numeric, value: 2, tolerance: 0.01 }
    solution: $I_1 = V/R_1 = 12/6 = 2\ A$.

  - id: sw2
    set: أ
    label: س٢
    kind: numeric
    prompt: نفس الدائرة، لكن فتحنا S₂ بس (سيبنا S₁ مقفول). احسب شدة التيار في فرع R₁ دلوقتي.
    check: { type: numeric, value: 2, tolerance: 0.01 }
    hint: فرق الجهد على فرع R₁ اتغيّرش — البطارية لسه واصلة بيه بنفس الطريقة.
    solution: $I_1 = V/R_1 = 12/6 = 2\ A$ — نفس القيمة بالظبط، لأن فتح S₂ ماأثرش على فرع R₁.

  - id: sw3
    set: أ
    label: س٣
    kind: numeric
    prompt: نفس الدائرة (S₂ مفتوح). احسب شدة التيار في فرع R₂.
    check: { type: numeric, value: 0, tolerance: 0.001 }
    solution: $I_2 = 0\ A$ — الفرع مقطوع تمامًا لأن مفتاحه مفتوح.

  - id: sw4
    set: ب
    label: س٤
    kind: numeric
    prompt: >-
      R₁ = 4 أوم على التوالي مع R₂ = 8 أوم، ومفتاح تجاوز S موازي لـR₂ بس، بطارية 24 فولت. S مفتوح.
      احسب شدة التيار الكلي.
    check: { type: numeric, value: 2, tolerance: 0.01 }
    solution: $I = V/(R_1 + R_2) = 24/12 = 2\ A$.

  - id: sw5
    set: ب
    label: س٥
    kind: numeric
    prompt: نفس الدائرة، لكن قفلنا S دلوقتي (فبقى بيتجاوز R₂). احسب شدة التيار الكلي.
    check: { type: numeric, value: 6, tolerance: 0.01 }
    hint: S مقفول معناه مقاومته صفر، فمقاومة R₂ ملغاة تمامًا من الحساب.
    solution: $R_{total} = R_1 + 0 = 4\ \Omega \Rightarrow I = 24/4 = 6\ A$.

  - id: sw6
    set: ب
    label: س٦
    kind: numeric
    prompt: نفس الدائرة (S مقفول). احسب شدة التيار المار في R₂ بالذات.
    check: { type: numeric, value: 0, tolerance: 0.001 }
    solution: $I_{R_2} = 0\ A$ — كل التيار بياخد طريق S (مقاومة صفر) بدل ما يعدي في R₂.

  - id: sw7
    set: ج
    label: س٧
    kind: multichoice
    prompt: مفتاح على الخط الرئيسي للدائرة (على التوالي مع كل حاجة) لما يتفتح...
    choices:
      - { id: all_stop, label: بيوقف التيار في الدائرة كلها بلا استثناء }
      - { id: one_branch, label: بيوقف فرع واحد بس }
      - { id: nothing, label: مبيأثرش على حاجة }
      - { id: doubles, label: بيضاعف التيار في باقي الدائرة }
    check: { type: exact, value: all_stop }
    solution: بيوقف التيار في الدائرة كلها — لأن كل التيار لازم يعدي منه عشان يوصل لأي عنصر تاني.

  - id: sw8
    set: ج
    label: س٨
    kind: truefalse
    prompt: >-
      صح ولا غلط — في دائرة فيها فرعان على التوازي، كل واحد بمفتاحه الخاص، فتح مفتاح فرع معيّن
      بيغيّر شدة التيار في الفرع التاني.
    check: { type: exact, value: false }
    explain: { required: true, hint: فكّر في إيه اللي بيحدد فرق الجهد على أي فرع في دائرة توازي. }
    solution: >-
      غلط. فرق الجهد على كل فرع في دائرة توازي بيحدده مصدر الجهد (البطارية)، مش حالة الفروع
      التانية — فتح مفتاح فرع بيقطع الفرع ده بس، والفروع التانية بتفضل بنفس فرق الجهد وبالتالي
      بنفس التيار.

  - id: sw9
    set: ج
    label: س٩
    kind: text
    prompt: >-
      اشرح ليه قفل مفتاح متوصّل على التوازي مع مقاومة (مفتاح تجاوز) بيسبب زيادة كبيرة في التيار
      الكلي، وليه ده خطير عمليًا لو حصل بالغلط في جهاز حقيقي.
    check: { type: tutor }
    solution: >-
      لما المفتاح يقفل، هو بيوفّر مسار مقاومته صفر موازي للمقاومة، فالمقاومة المكافئة للاتنين
      تبقى صفر تقريبًا — أي إن المقاومة الأصلية بقت ملغاة من حساب المقاومة الكلية للدائرة. بما إن
      $I = V/R_{total}$ وفرق الجهد ثابت، نقص المقاومة الكلية بيزوّد التيار بشكل كبير. عمليًا، ده
      اللي بيحصل في "الشورت سركِت" (short circuit): تيار مرتفع جدًا فجأة ممكن يسخّن الأسلاك بسرعة
      أو يحرق مكونات مش مصممة تستحمل تيار بالحجم ده — وده بالظبط اللي الفيوز أو القاطع الكهربي
      معمول عشان يمنعه.
