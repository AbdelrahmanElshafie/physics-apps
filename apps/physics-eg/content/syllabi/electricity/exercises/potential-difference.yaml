# تمارين: فرق الجهد الكهربي
#
# مجموعة أ: V = W/Q. مجموعة ب: V_AB = V_A - V_B. مجموعة ج: مفاهيم (الفولتميتر والأميتر).

schemaVersion: 1
topic: potential-difference
intro: ثمانية أسئلة. الإجابات الرقمية والاختيارية بتتحقق فورًا.

exercises:
  - id: pd1
    set: أ
    label: س١
    kind: numeric
    prompt: نقل شحنة مقدارها 20 كولوم بين نقطتين احتاج 100 جول من الشغل. احسب فرق الجهد بينهم.
    check: { type: numeric, value: 5, tolerance: 0.01 }
    solution: $V = W/Q = 100/20 = 5\ V$.

  - id: pd2
    set: أ
    label: س٢
    kind: numeric
    prompt: فرق الجهد بين نقطتين 12 فولت. كام شغل هيتبذل لنقل شحنة مقدارها 4 كولوم بينهم؟
    check: { type: numeric, value: 48, tolerance: 0.01 }
    hint: اعكس القانون — W = QV.
    solution: $W = QV = 4 \times 12 = 48\ J$.

  - id: pd3
    set: أ
    label: س٣
    kind: numeric
    prompt: >-
      انتقلت شحنة مقدارها 0.5 كولوم بين نقطتين فرق الجهد بينهم 220 فولت (زي جهد المصر في البيت).
      احسب الشغل المبذول.
    check: { type: numeric, value: 110, tolerance: 0.1 }
    solution: $W = QV = 0.5 \times 220 = 110\ J$.

  - id: pd4
    set: ب
    label: س٤
    kind: numeric
    prompt: جهد نقطة A يساوي 20 فولت، وجهد نقطة B يساوي −30 فولت. احسب فرق الجهد $V_{AB}$.
    check: { type: numeric, value: 50, tolerance: 0.01 }
    hint: لا تنسَ الإشارة السالبة لجهد B — الطرح من عدد سالب يبقى جمع.
    solution: $V_{AB} = V_A - V_B = 20 - (-30) = 50\ V$.

  - id: pd5
    set: ب
    label: س٥
    kind: numeric
    prompt: جهد نقطة A يساوي −15 فولت، وجهد نقطة B يساوي 5 فولت. احسب $V_{BA}$.
    check: { type: numeric, value: 20, tolerance: 0.01 }
    solution: $V_{BA} = V_B - V_A = 5 - (-15) = 20\ V$.

  - id: pd6
    set: ب
    label: س٦
    kind: truefalse
    prompt: صح ولا غلط — لو غيّرنا نقطة الجهد المرجعي (صفر الجهد)، فإن $V_{AB}$ هيتغيّر هو كمان.
    check: { type: exact, value: false }
    explain: { required: true, hint: فكّر في V_A و V_B كل واحد بيتغير بنفس المقدار. }
    solution: >-
      غلط. تغيير المرجع بيضيف نفس المقدار الثابت لكل الجهود المطلقة، فـ
      $V_{AB} = V_A - V_B$ يفضل زي ما هو — الثابت المُضاف بيتشال في عملية الطرح.

  - id: pd7
    set: ج
    label: س٧
    kind: multichoice
    prompt: الفولتميتر لازم يتوصّل في الدائرة...
    choices:
      - { id: series, label: على التوالي مع الجزء المراد قياسه }
      - { id: parallel, label: على التوازي مع الجزء المراد قياسه }
      - { id: anywhere, label: في أي مكان في الدائرة، مفيش فرق }
      - { id: ground_only, label: بين أي نقطة والأرضي فقط }
    check: { type: exact, value: parallel }
    solution: >-
      على التوازي. مقاومته الداخلية الكبيرة جدًا معناها إنه لو اتوصّل على التوالي هيقطع
      التيار بدل ما يقيسه.

  - id: pd8
    set: ج
    label: س٨
    kind: text
    prompt: >-
      اشرح ليه لازم تكون مقاومة الفولتميتر الداخلية كبيرة جدًا (مش صفر ولا قيمة متوسطة)، بينما
      مقاومة الأميتر الداخلية لازم تكون صغيرة جدًا (قريبة من الصفر).
    check: { type: tutor }
    solution: >-
      أي جهاز قياس بيتوصّل في الدائرة بيصبح جزء منها، فلازم يأثر أقل ما يمكن على القيمة اللي
      بيقيسها. الفولتميتر متوصّل على التوازي، فلو مقاومته صغيرة هيسحب تيار كبير لنفسه ويغيّر
      توزيع التيار في الدائرة كلها. الأميتر متوصّل على التوالي، فلو مقاومته كبيرة هو نفسه هيضيف
      مقاومة زيادة تقلل التيار اللي المفروض يقيسه. الحالة المثالية في الحالتين هي "الجهاز
      كأنه مش موجود" بالنسبة للدائرة — فولتميتر بلا نهائي المقاومة، وأميتر بصفر مقاومة.
