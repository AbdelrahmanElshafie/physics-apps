# تمارين: مقارنة بين التوالي والتوازي
#
# مجموعة أ: المقاومة المكافئة لنفس المقاومات بالطريقتين. مجموعة ب: التيار الكلي بالطريقتين.
# مجموعة ج: مفاهيم.

schemaVersion: 1
topic: series-vs-parallel
intro: تسعة أسئلة. الإجابات الرقمية والاختيارية بتتحقق فورًا.

exercises:
  - id: sp1
    set: أ
    label: س١
    kind: numeric
    prompt: مقاومتان قيمة كل واحدة 6 أوم. احسب المقاومة المكافئة لو وصّلناهم على التوالي.
    check: { type: numeric, value: 12, tolerance: 0.01 }
    solution: $R_{series} = 6 + 6 = 12\ \Omega$.

  - id: sp2
    set: أ
    label: س٢
    kind: numeric
    prompt: نفس المقاومتين (6 أوم لكل واحدة). احسب المقاومة المكافئة لو وصّلناهم على التوازي.
    check: { type: numeric, value: 3, tolerance: 0.01 }
    solution: $\frac{1}{R_{parallel}} = \frac{1}{6} + \frac{1}{6} = \frac{1}{3} \Rightarrow R_{parallel} = 3\ \Omega$.

  - id: sp3
    set: أ
    label: س٣
    kind: numeric
    prompt: من إجابتَي السؤالين السابقين، احسب النسبة بين المقاومة المكافئة للتوالي والمقاومة المكافئة للتوازي.
    check: { type: numeric, value: 4, tolerance: 0.01 }
    solution: $R_{series}/R_{parallel} = 12/3 = 4$.

  - id: sp4
    set: ب
    label: س٤
    kind: numeric
    prompt: نفس المقاومتين (6 أوم، 6 أوم) على التوالي، متصلتان ببطارية 12 فولت. احسب شدة التيار الكلي.
    check: { type: numeric, value: 1, tolerance: 0.01 }
    solution: $I = V/R_{eq} = 12/12 = 1\ A$.

  - id: sp5
    set: ب
    label: س٥
    kind: numeric
    prompt: نفس المقاومتين، لكن على التوازي هذه المرة، بنفس بطارية 12 فولت. احسب شدة التيار الكلي.
    check: { type: numeric, value: 4, tolerance: 0.01 }
    solution: $I = V/R_{eq} = 12/3 = 4\ A$.

  - id: sp6
    set: ب
    label: س٦
    kind: numeric
    prompt: من إجابتَي السؤالين السابقين، احسب النسبة بين تيار التوازي وتيار التوالي.
    check: { type: numeric, value: 4, tolerance: 0.01 }
    hint: النسبة دي هي نفسها نسبة المقاومتين المكافئتين، لكن مقلوبة.
    solution: $I_{parallel}/I_{series} = 4/1 = 4$.

  - id: sp7
    set: ج
    label: س٧
    kind: multichoice
    prompt: نفس المقاومات ونفس البطارية، مرة على التوالي ومرة على التوازي. أنهي توصيل بيخلّي البطارية تدّي تيار كلي (وقدرة) أكبر؟
    choices:
      - { id: series, label: التوالي }
      - { id: parallel, label: التوازي }
      - { id: same, label: نفس القيمة بالظبط }
      - { id: depends, label: بيعتمد على نوع البطارية بس }
    check: { type: exact, value: parallel }
    solution: التوازي — لأن مقاومته المكافئة أصغر، فالتيار الكلي (I = V/R) أكبر.

  - id: sp8
    set: ج
    label: س٨
    kind: truefalse
    prompt: صح ولا غلط — لنفس مجموعة المقاومات بالظبط، المقاومة المكافئة للتوالي دايمًا أكبر من المقاومة المكافئة للتوازي.
    check: { type: exact, value: true }
    explain: { required: true, hint: فكّر في مثال الـ6 أوم والـ6 أوم — 12 أوم مقابل 3 أوم. }
    solution: >-
      صح. التوالي دايمًا بيدّي مقاومة أكبر من أكبر مقاومة فردية، والتوازي دايمًا بيدّي مقاومة أصغر
      من أصغر مقاومة فردية — يبقى التوالي لازم يكون أكبر من التوازي لنفس المجموعة، مهما كانت القيم.

  - id: sp9
    set: ج
    label: س٩
    kind: text
    prompt: >-
      لمبة صغيرة عايزين نحدد التيار المار فيها عشان محترقش، فبنحط مقاومة إضافية معاها في الدائرة.
      المفروض نوصّل المقاومة دي على التوالي مع اللمبة ولا على التوازي معاها؟ وليه؟
    check: { type: tutor }
    solution: >-
      على التوالي. عشان "نحدد" التيار المار في اللمبة، محتاجين المقاومة الإضافية تكون على نفس
      مسار التيار بتاع اللمبة بالظبط، بحيث نفس التيار المحدود ده يمر في الاتنين — وده تعريف
      التوالي. لو وصّلناها على التوازي، اللمبة كانت هتاخد نفس فرق جهد المصدر كاملاً بدون أي تحديد،
      والمقاومة الإضافية كانت هتاخد فرع مستقل ليها من غير ما تأثر في تيار اللمبة خالص.
