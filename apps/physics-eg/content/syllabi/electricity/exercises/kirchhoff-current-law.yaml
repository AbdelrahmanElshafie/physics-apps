# تمارين: قانون كيرشوف الأول (قانون التفرع)
#
# مجموعة أ: نقط تلاقي مجرّدة. مجموعة ب: نفس دائرة الدرس (البطارية والفرعين). مجموعة ج: مفاهيم.

schemaVersion: 1
topic: kirchhoff-current-law
intro: تسعة أسئلة. الإجابات الرقمية والاختيارية بتتحقق فورًا.

exercises:
  - id: kcl1
    set: أ
    label: س١
    kind: numeric
    prompt: نقطة تلاقي فيها I₁ = 5 أمبير وI₂ = 2 أمبير داخلان، وI₃ خارج. احسب I₃.
    check: { type: numeric, value: 7, tolerance: 0.01 }
    solution: $I_1 + I_2 = I_3 \Rightarrow I_3 = 5 + 2 = 7\ A$.

  - id: kcl2
    set: أ
    label: س٢
    kind: numeric
    prompt: نقطة تلاقي فيها I₁ = 10 أمبير داخل وI₂ داخل كمان، وI₃ = 6 أمبير وI₄ = 9 أمبير خارجان. احسب I₂.
    check: { type: numeric, value: 5, tolerance: 0.01 }
    hint: مجموع الداخل (I₁ + I₂) لازم يساوي مجموع الخارج (I₃ + I₄).
    solution: $I_1 + I_2 = I_3 + I_4 \Rightarrow 10 + I_2 = 6 + 9 \Rightarrow I_2 = 5\ A$.

  - id: kcl3
    set: أ
    label: س٣
    kind: numeric
    prompt: نقطة تلاقي فيها I = 8 أمبير داخل، وفرعان خارجان I₂ = 3 أمبير وI₃. احسب I₃.
    check: { type: numeric, value: 5, tolerance: 0.01 }
    solution: $I = I_2 + I_3 \Rightarrow I_3 = 8 - 3 = 5\ A$.

  - id: kcl4
    set: ب
    label: س٤
    kind: numeric
    prompt: >-
      دائرة زي مثال الدرس: بطارية 12 فولت متصلة بفرعين على التوازي (R₁ = 4 أوم وR₂ = 6 أوم). احسب
      شدة التيار في فرع R₁.
    check: { type: numeric, value: 3, tolerance: 0.01 }
    solution: $I_1 = V/R_1 = 12/4 = 3\ A$.

  - id: kcl5
    set: ب
    label: س٥
    kind: numeric
    prompt: نفس الدائرة. احسب شدة التيار في فرع R₂.
    check: { type: numeric, value: 2, tolerance: 0.01 }
    solution: $I_2 = V/R_2 = 12/6 = 2\ A$.

  - id: kcl6
    set: ب
    label: س٦
    kind: numeric
    prompt: نفس الدائرة. احسب شدة التيار الكلي الخارج من البطارية، باستخدام قانون كيرشوف الأول عند نقطة التفرع.
    check: { type: numeric, value: 5, tolerance: 0.01 }
    hint: عند نقطة التفرع، التيار الداخل (من البطارية) لازم يساوي مجموع تيارَي الفرعين.
    solution: $I_{total} = I_1 + I_2 = 3 + 2 = 5\ A$.

  - id: kcl7
    set: ج
    label: س٧
    kind: multichoice
    prompt: الأساس الفيزيائي لقانون كيرشوف الأول هو...
    choices:
      - { id: charge_conservation, label: حفظ الشحنة — الشحنة متتولّدش ومتتفناش عند أي نقطة }
      - { id: energy_conservation, label: حفظ الطاقة }
      - { id: ohms_law, label: قانون أوم }
      - { id: no_basis, label: مفيهوش أساس فيزيائي، هو مجرد ملاحظة تجريبية }
    check: { type: exact, value: charge_conservation }
    solution: >-
      حفظ الشحنة — لو التيار الداخل كان أكبر من الخارج، شحنة كانت هتتراكم عند النقطة دي للأبد، وده
      مبيحصلش في دائرة مستقرة.

  - id: kcl8
    set: ج
    label: س٨
    kind: truefalse
    prompt: صح ولا غلط — قانون كيرشوف الأول بينطبق بس على نقط التلاقي اللي فيها فرعان بالظبط (زي التوازي البسيط).
    check: { type: exact, value: false }
    explain: { required: true, hint: فكّر في المثال اللي فيه فرعان داخلان وفرعان خارجان في الدرس. }
    solution: >-
      غلط. القانون عام تمامًا وبينطبق على أي عدد من الفروع الداخلة والخارجة عند أي نقطة تلاقي —
      الشرط الوحيد إن مجموع الداخل يساوي مجموع الخارج.

  - id: kcl9
    set: ج
    label: س٩
    kind: text
    prompt: >-
      اشرح ليه قاعدتَي "نفس التيار على التوالي" و"التيار بيتوزع على التوازي" (اللي درسناهم زمان) مش
      قوانين منفصلة عن قانون كيرشوف الأول، لكنهم حالتان خاصتان منه.
    check: { type: tutor }
    solution: >-
      قانون كيرشوف الأول بيقول إن مجموع التيار الداخل لنقطة تلاقي يساوي مجموع التيار الخارج منها.
      على التوالي، نقطة التلاقي بين أي مقاومتين فيها فرع داخل واحد وفرع خارج واحد بس، فالقانون
      بيديك $I_{in} = I_{out}$ — وده بالظبط "نفس التيار". على التوازي، نقطة التفرع فيها فرع داخل
      واحد (من البطارية) وعدة فروع خارجة (فروع التوازي)، فالقانون بيديك $I_{in} = I_1 + I_2 + \dots$
      — وده بالظبط "التيار بيتوزع". يعني الحالتين دول مجرد تطبيق للقانون العام على أبسط شكلين
      لنقطة التلاقي، مش قوانين مستقلة عنه.
