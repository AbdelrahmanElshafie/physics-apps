# تمارين: توصيل الخلايا متفقة ومختلفة القطبية
#
# مجموعة أ: قطبية متفقة. مجموعة ب: نفس الخليتين بقطبية مختلفة. مجموعة ج: مفاهيم.

schemaVersion: 1
topic: cells-aiding-opposing
intro: تسعة أسئلة. الإجابات الرقمية والاختيارية بتتحقق فورًا.

exercises:
  - id: ca1
    set: أ
    label: س١
    kind: numeric
    prompt: >-
      خليتان بقطبية متفقة، EMF الأولى 6 فولت والتانية 3 فولت (زي مثال الدرس). احسب الـEMF الكلية.
    check: { type: numeric, value: 9, tolerance: 0.01 }
    solution: $\varepsilon_{total} = 6 + 3 = 9\ V$.

  - id: ca2
    set: أ
    label: س٢
    kind: numeric
    prompt: نفس الخليتين، مقاومة كل واحدة الداخلية 0.5 أوم. احسب المقاومة الداخلية الكلية.
    check: { type: numeric, value: 1, tolerance: 0.01 }
    solution: $r_{total} = 0.5 + 0.5 = 1\ \Omega$.

  - id: ca3
    set: أ
    label: س٣
    kind: numeric
    prompt: نفس الدائرة، متصلة بمقاومة خارجية 3.5 أوم. احسب شدة التيار في الدائرة.
    check: { type: numeric, value: 2, tolerance: 0.01 }
    solution: $I = \varepsilon_{total}/(R + r_{total}) = 9/(3.5+1) = 2\ A$.

  - id: ca4
    set: ب
    label: س٤
    kind: numeric
    prompt: نفس الخليتين (6 فولت و3 فولت)، لكن بقطبية مختلفة دلوقتي. احسب الـEMF الصافية.
    check: { type: numeric, value: 3, tolerance: 0.01 }
    solution: $\varepsilon_{net} = |6 - 3| = 3\ V$.

  - id: ca5
    set: ب
    label: س٥
    kind: numeric
    prompt: نفس الخليتين (بقطبية مختلفة). احسب المقاومة الداخلية الكلية.
    check: { type: numeric, value: 1, tolerance: 0.01 }
    hint: قلب القطبية مبيأثرش على المقاومة الداخلية خالص.
    solution: $r_{total} = 0.5 + 0.5 = 1\ \Omega$ — نفس القيمة بالظبط زي حالة القطبية المتفقة.

  - id: ca6
    set: ب
    label: س٦
    kind: numeric
    prompt: نفس الدائرة (قطبية مختلفة)، متصلة بنفس المقاومة الخارجية 3.5 أوم. احسب شدة التيار.
    check: { type: numeric, value: 0.667, tolerance: 0.01 }
    solution: $I = \varepsilon_{net}/(R + r_{total}) = 3/(3.5+1) = 2/3 \approx 0.667\ A$.

  - id: ca7
    set: ج
    label: س٧
    kind: multichoice
    prompt: خليتان على التوالي بقطبية متفقة، EMF كل واحدة معروفة. الـEMF الكلية للمجموعة بتساوي...
    choices:
      - { id: sum, label: مجموع الاتنين }
      - { id: diff, label: الفرق بين الاتنين }
      - { id: avg, label: متوسط الاتنين }
      - { id: max, label: أكبر واحدة فيهم بس }
    check: { type: exact, value: sum }
    solution: مجموع الاتنين — لأنهم بيدفعوا التيار في نفس الاتجاه، فكل واحدة بتضيف فوق التانية.

  - id: ca8
    set: ج
    label: س٨
    kind: truefalse
    prompt: صح ولا غلط — قلب قطبية خلية واحدة في توصيل على التوالي بيغيّر قيمة المقاومة الداخلية الكلية للدائرة.
    check: { type: exact, value: false }
    explain: { required: true, hint: المقاومة الداخلية خاصية مادية للخلية — هل ليها اتجاه أصلاً؟ }
    solution: >-
      غلط. المقاومة الداخلية مالهاش اتجاه أو قطبية، فبتتجمع بنفس الطريقة سواء كانت الخلايا متفقة
      أو مختلفة القطبية. اللي بيتغيّر بقلب القطبية هو الـEMF بس (من جمع لطرح).

  - id: ca9
    set: ج
    label: س٩
    kind: text
    prompt: >-
      اشرح ليه المقاومة الداخلية الكلية بتتحسب بنفس الطريقة بالظبط (بالجمع) في حالتَي القطبية
      المتفقة والمختلفة، مع إن الـEMF الكلية بتتجمع في حالة وبتتطارح في التانية.
    check: { type: tutor }
    solution: >-
      الـEMF كمية ليها اتجاه — بتمثّل "دفعة" الخلية للتيار في اتجاه معيّن، فلما خليتين يتفقوا في
      الاتجاه ده الدفعتين بيتجمعوا، ولما يختلفوا الدفعتين بيتعارضوا فبيتطارحوا. المقاومة الداخلية
      مختلفة تمامًا: هي خاصية مادية بتقاوم أي تيار عادي بيعدي فيها، مالهاش "اتجاه" تتفق أو تختلف فيه
      مع مقاومة تانية. عشان كده أي مقاومتين على التوالي (داخلية كانت أو خارجية) بتتجمع بالجمع
      العادي دايمًا، بغض النظر عن اتجاه أو قطبية أي مصدر جهد في نفس الدائرة.
