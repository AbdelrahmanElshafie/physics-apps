# تمارين: توصيل المقاومات على التوازي
#
# مجموعة أ: المقاومة المكافئة والتيار الكلي. مجموعة ب: مثال الدرس (25/70/85 أوم). مجموعة ج: مفاهيم.

schemaVersion: 1
topic: parallel-resistors
intro: تسعة أسئلة. الإجابات الرقمية والاختيارية بتتحقق فورًا.

exercises:
  - id: pr1
    set: أ
    label: س١
    kind: numeric
    prompt: مقاومتان قيمة كل واحدة منهما 4 أوم متصلتان على التوازي. احسب المقاومة المكافئة.
    check: { type: numeric, value: 2, tolerance: 0.01 }
    solution: $\frac{1}{R_{eq}} = \frac{1}{4} + \frac{1}{4} = \frac{1}{2} \Rightarrow R_{eq} = 2\ \Omega$.

  - id: pr2
    set: أ
    label: س٢
    kind: numeric
    prompt: >-
      نفس المقاومتين في السؤال السابق (المكافئة لهما 2 أوم) متصلتان ببطارية فرق جهدها 8 فولت.
      احسب شدة التيار الكلي الخارج من البطارية.
    check: { type: numeric, value: 4, tolerance: 0.01 }
    hint: استخدم قانون أوم على الدائرة كلها بالمقاومة المكافئة.
    solution: $I = V/R_{eq} = 8/2 = 4\ A$.

  - id: pr3
    set: أ
    label: س٣
    kind: numeric
    prompt: نفس الدائرة (فرق الجهد 8 فولت على كل فرع). احسب شدة التيار المارة في فرع واحد بس من الفرعين (4 أوم).
    check: { type: numeric, value: 2, tolerance: 0.01 }
    hint: كل فرع بياخد نفس فرق الجهد الكلي، فاستخدم قانون أوم على الفرع لوحده.
    solution: $I_1 = V/R_1 = 8/4 = 2\ A$.

  - id: pr4
    set: ب
    label: س٤
    kind: numeric
    prompt: >-
      ثلاث مقاومات 25 أوم و70 أوم و85 أوم على التوازي (زي مثال الدرس)، متصلة ببطارية 45 فولت.
      احسب المقاومة المكافئة.
    check: { type: numeric, value: 15.14, tolerance: 0.01 }
    hint: مقلوب المقاومة المكافئة هو مجموع مقلوبات المقاومات.
    solution: >-
      $\frac{1}{R_{eq}} = \frac{1}{25} + \frac{1}{70} + \frac{1}{85} \approx 0.06605\ \Omega^{-1}
      \Rightarrow R_{eq} \approx 15.14\ \Omega$.

  - id: pr5
    set: ب
    label: س٥
    kind: numeric
    prompt: نفس دائرة السؤال السابق. احسب شدة التيار الكلي الخارج من البطارية.
    check: { type: numeric, value: 2.97, tolerance: 0.01 }
    solution: $I = V/R_{eq} = 45/15.14 \approx 2.97\ A$ — أو بجمع تيارات الفروع الثلاثة مباشرة.

  - id: pr6
    set: ب
    label: س٦
    kind: numeric
    prompt: نفس دائرة السؤال السابق. احسب شدة التيار المار في فرع الـ70 أوم بالذات.
    check: { type: numeric, value: 0.643, tolerance: 0.01 }
    solution: $I_2 = V/R_2 = 45/70 \approx 0.643\ A$.

  - id: pr7
    set: ج
    label: س٧
    kind: multichoice
    prompt: في توصيل التوازي، إيه اللي بيفضل ثابت (نفس القيمة) على كل فرع؟
    choices:
      - { id: current, label: شدة التيار }
      - { id: voltage, label: فرق الجهد }
      - { id: resistance, label: المقاومة }
      - { id: power, label: القدرة الكهربية }
    check: { type: exact, value: voltage }
    solution: فرق الجهد — لأن كل الفروع واصلة بين نفس النقطتين بالظبط.

  - id: pr8
    set: ج
    label: س٨
    kind: truefalse
    prompt: صح ولا غلط — إضافة فرع جديد (مقاومة) على التوازي في دائرة (بنفس البطارية) بتزوّد شدة التيار الكلي الخارج من البطارية.
    check: { type: exact, value: true }
    explain: { required: true, hint: فكّر في تأثير الفرع الجديد على المقاومة المكافئة، وعلى قانون أوم بعد كده. }
    solution: >-
      صح. إضافة فرع على التوازي بتقلّل المقاومة المكافئة $R_{eq}$ (لأنها بتفتح طريق إضافي للتيار)،
      وبما إن فرق الجهد ثابت، فشدة التيار الكلي $I = V/R_{eq}$ بتزيد.

  - id: pr9
    set: ج
    label: س٩
    kind: text
    prompt: >-
      ليه توصيلات الكهرباء في البيت (الأجهزة المختلفة زي التلاجة والغسالة والإضاءة) بتكون على
      التوازي مش على التوالي؟
    check: { type: tutor }
    solution: >-
      في التوازي، كل جهاز على فرع مستقل بينه وبين نفس فرق جهد المصدر (220 فولت مثلًا) — فكل جهاز
      بياخد فرق الجهد اللي مصمم عليه بالظبط، بغض النظر عن باقي الأجهزة. كمان لو جهاز اتعطّل أو
      اتقفل، الأجهزة التانية بتفضل شغالة عادي لأن فروعها لسه متصلة بالمصدر. لو كانوا على التوالي،
      كل الأجهزة كانت هتشارك فرق جهد المصدر فيما بينها (فمفيش جهاز هياخد الجهد الكامل اللي محتاجه)،
      وأي جهاز يتعطّل هيقطع الدائرة كلها.
