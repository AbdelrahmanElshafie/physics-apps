# تمارين: سطوع المصابيح على التوالي والتوازي
#
# مجموعة أ: مصباحان متطابقان (4 أوم، 12 فولت). مجموعة ب: مصباحان مختلفان (2 و4 أوم، 12 فولت).
# مجموعة ج: مفاهيم.

schemaVersion: 1
topic: lamps-brightness
intro: تسعة أسئلة. الإجابات الرقمية والاختيارية بتتحقق فورًا.

exercises:
  - id: lb1
    set: أ
    label: س١
    kind: numeric
    prompt: مصباح مقاومته 4 أوم متصل لوحده ببطارية 12 فولت. احسب القدرة الكهربية المستهلكة فيه.
    check: { type: numeric, value: 36, tolerance: 0.01 }
    solution: $P = V^2/R = 12^2/4 = 36\ W$.

  - id: lb2
    set: أ
    label: س٢
    kind: numeric
    prompt: نفس المصباح (4 أوم)، لكن دلوقتي على التوالي مع مصباح تاني متطابق، بنفس بطارية 12 فولت. احسب قدرة كل مصباح.
    check: { type: numeric, value: 9, tolerance: 0.01 }
    hint: احسب التيار الكلي الأول (المقاومة الكلية اتضاعفت)، وبعدين استخدم P = I²R.
    solution: >-
      $I = V/(R+R) = 12/8 = 1.5\ A$، وبعدين $P = I^2 R = 1.5^2 \times 4 = 9\ W$ لكل مصباح.

  - id: lb3
    set: أ
    label: س٣
    kind: numeric
    prompt: نفس المصباح (4 أوم)، لكن دلوقتي على التوازي مع مصباح تاني متطابق، بنفس بطارية 12 فولت. احسب قدرة كل مصباح.
    check: { type: numeric, value: 36, tolerance: 0.01 }
    hint: كل مصباح على التوازي لسه باخد فرق الجهد الكلي كامل.
    solution: $P = V^2/R = 12^2/4 = 36\ W$ — نفس القيمة بالظبط لو كان لوحده.

  - id: lb4
    set: ب
    label: س٤
    kind: numeric
    prompt: مصباحان R₁ = 2 أوم وR₂ = 4 أوم على التوالي، بطارية 12 فولت. احسب قدرة المصباح R₁.
    check: { type: numeric, value: 8, tolerance: 0.01 }
    hint: احسب التيار الكلي الأول (نفسه في الاتنين)، وبعدين استخدم P = I²R على R₁.
    solution: $I = 12/(2+4) = 2\ A$، وبعدين $P_1 = I^2 R_1 = 2^2 \times 2 = 8\ W$.

  - id: lb5
    set: ب
    label: س٥
    kind: numeric
    prompt: نفس الدائرة (R₁ = 2 أوم وR₂ = 4 أوم على التوالي، بطارية 12 فولت). احسب قدرة المصباح R₂.
    check: { type: numeric, value: 16, tolerance: 0.01 }
    solution: $P_2 = I^2 R_2 = 2^2 \times 4 = 16\ W$ — أكبر من P₁ رغم إن التيار واحد.

  - id: lb6
    set: ب
    label: س٦
    kind: numeric
    prompt: نفس المصباحين (R₁ = 2 أوم وR₂ = 4 أوم)، لكن على التوازي هذه المرة، بنفس بطارية 12 فولت. احسب قدرة المصباح R₁.
    check: { type: numeric, value: 72, tolerance: 0.01 }
    hint: على التوازي، فرق الجهد الكامل (12V) على كل مصباح — استخدم P = V²/R.
    solution: $P_1 = V^2/R_1 = 12^2/2 = 72\ W$ — أكبر من قدرة R₂ (36 واط) دلوقتي، عكس حالة التوالي.

  - id: lb7
    set: ج
    label: س٧
    kind: multichoice
    prompt: مصباحان مختلفان متصلان على التوالي (نفس التيار في الاتنين). أنهي مصباح هيكون أسطع؟
    choices:
      - { id: bigger_r, label: صاحب المقاومة الأكبر }
      - { id: smaller_r, label: صاحب المقاومة الأصغر }
      - { id: same, label: هيضووا بنفس الدرجة بالظبط }
      - { id: depends_v, label: بيعتمد على فرق الجهد الكلي بس }
    check: { type: exact, value: bigger_r }
    solution: صاحب المقاومة الأكبر — لأن P = I²R، والتيار واحد على التوالي.

  - id: lb8
    set: ج
    label: س٨
    kind: truefalse
    prompt: >-
      صح ولا غلط — إضافة مصباح جديد على التوازي مع مصباح موجود بتضعّف سطوع المصباح الموجود، زي ما
      بيحصل بالظبط لو أضفناه على التوالي.
    check: { type: exact, value: false }
    explain: { required: true, hint: فكّر في فرق الجهد على المصباح الموجود قبل وبعد إضافة الفرع الجديد. }
    solution: >-
      غلط. على التوازي، إضافة فرع جديد مبيغيّرش فرق الجهد على الفروع الموجودة (البطارية هي اللي
      بتحدده)، فقدرة المصباح الموجود (P = V²/R) بتفضل زي ما هي بالظبط. على التوالي بس هي اللي
      بتضعّف كل حاجة، لأن إضافة مقاومة بتقلل التيار الكلي اللي بيمر في الجميع.

  - id: lb9
    set: ج
    label: س٩
    kind: text
    prompt: >-
      اشرح ليه المصباح صاحب المقاومة الأكبر بيكون الأسطع على التوالي، لكن المصباح صاحب المقاومة
      الأصغر بيكون الأسطع على التوازي — نفس المصباحين بالظبط، لكن النتيجة اتقلبت.
    check: { type: tutor }
    solution: >-
      على التوالي، الكمية الثابتة هي التيار (نفس القيمة في كل مصباح)، فأنسب صيغة للقدرة هي
      $P = I^2R$ — وبما إن I ثابت، القدرة بتزيد كل ما R كانت أكبر. على التوازي، الكمية الثابتة
      هي فرق الجهد (نفس القيمة على كل فرع)، فأنسب صيغة هي $P = V^2/R$ — وبما إن V ثابت، القدرة
      دلوقتي بتزيد كل ما R كانت أصغر (لأن مقاومة أصغر معناها تيار أكبر بيعديها). نفس القانون
      الأساسي ($P=I^2R=V^2/R$)، لكن الكمية الثابتة اتغيّرت من التيار للجهد، فاتجاه العلاقة مع R
      اتقلب بالكامل.
