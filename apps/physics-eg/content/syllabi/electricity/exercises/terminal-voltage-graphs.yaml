# تمارين: قراءة العلاقة البيانية بين الجهد والتيار
#
# مجموعة أ: نقطتان جديدتان. مجموعة ب: نفس بيانات خلية الدرس، نقطتان مختلفتان. مجموعة ج: مفاهيم.

schemaVersion: 1
topic: terminal-voltage-graphs
intro: تسعة أسئلة. الإجابات الرقمية والاختيارية بتتحقق فورًا.

exercises:
  - id: tv1
    set: أ
    label: س١
    kind: numeric
    prompt: >-
      خلية اتقاست عند نقطتين: (I₁ = 2 أمبير، V₁ = 8 فولت) و(I₂ = 5 أمبير، V₂ = 5 فولت). احسب ميل
      الخط.
    check: { type: numeric, value: -1, tolerance: 0.01 }
    solution: $m = (5-8)/(5-2) = -1$.

  - id: tv2
    set: أ
    label: س٢
    kind: numeric
    prompt: نفس البيانات. احسب المقاومة الداخلية للخلية.
    check: { type: numeric, value: 1, tolerance: 0.01 }
    hint: المقاومة الداخلية هي القيمة المطلقة للميل.
    solution: $r = |m| = |-1| = 1\ \Omega$.

  - id: tv3
    set: أ
    label: س٣
    kind: numeric
    prompt: نفس البيانات. احسب القوة الدافعة الكهربية (EMF) للخلية.
    check: { type: numeric, value: 10, tolerance: 0.01 }
    hint: عوّض بأي نقطة من الاتنين في معادلة الخط.
    solution: $\varepsilon = V_1 - mI_1 = 8 - (-1)(2) = 10\ V$.

  - id: tv4
    set: ب
    label: س٤
    kind: numeric
    prompt: >-
      نفس خلية الدرس، لكن اتقاست عند نقطتين مختلفتين هذه المرة: (I₁ = 0.5 أمبير، V₁ = 5.75 فولت)
      و(I₂ = 2.5 أمبير، V₂ = 4.75 فولت). احسب ميل الخط.
    check: { type: numeric, value: -0.5, tolerance: 0.01 }
    solution: $m = (4.75-5.75)/(2.5-0.5) = -0.5$.

  - id: tv5
    set: ب
    label: س٥
    kind: numeric
    prompt: نفس البيانات. احسب المقاومة الداخلية.
    check: { type: numeric, value: 0.5, tolerance: 0.01 }
    solution: $r = |{-0.5}| = 0.5\ \Omega$ — نفس قيمة خلية الدرس، زي المتوقع.

  - id: tv6
    set: ب
    label: س٦
    kind: numeric
    prompt: نفس البيانات. احسب القوة الدافعة الكهربية.
    check: { type: numeric, value: 6, tolerance: 0.01 }
    solution: >-
      $\varepsilon = V_1 - mI_1 = 5.75 - (-0.5)(0.5) = 6\ V$ — نفس قيمة خلية الدرس، رغم إننا
      استخدمنا نقطتين مختلفتين عن الرسم الأصلي.

  - id: tv7
    set: ج
    label: س٧
    kind: multichoice
    prompt: التقاطع مع محور V في رسم بياني بين فرق الجهد الطرفي وشدة التيار بيمثّل...
    choices:
      - { id: emf, label: القوة الدافعة الكهربية (EMF) }
      - { id: internal_r, label: المقاومة الداخلية }
      - { id: external_r, label: المقاومة الخارجية }
      - { id: power, label: القدرة الكهربية القصوى }
    check: { type: exact, value: emf }
    solution: القوة الدافعة الكهربية — لأن عند I = 0، لا يوجد فقد داخلي، فـV تساوي ε بالظبط.

  - id: tv8
    set: ج
    label: س٨
    kind: truefalse
    prompt: صح ولا غلط — كل ما كان ميل الخط أكبر في القيمة المطلقة (الخط أميل)، كل ما كانت المقاومة الداخلية للخلية أصغر.
    check: { type: exact, value: false }
    explain: { required: true, hint: فكّر في تعريف r بدلالة الميل. }
    solution: >-
      غلط. المقاومة الداخلية تساوي القيمة المطلقة للميل ($r = |m|$) — فكل ما الخط كان أميل (ميل
      أكبر في القيمة المطلقة)، كل ما كانت المقاومة الداخلية **أكبر**، مش أصغر.

  - id: tv9
    set: ج
    label: س٩
    kind: text
    prompt: >-
      ليه الأسهل عمليًا إننا نحسب EMF والمقاومة الداخلية من نقطتين مقاسَتين باستخدام معادلة الخط،
      بدل ما نحاول نقيس V مباشرة عند I = 0؟
    check: { type: tutor }
    solution: >-
      قياس V عند I = 0 بالظبط يعني عمليًا فصل الخلية عن أي دائرة (دائرة مفتوحة تمامًا)، وده مش نفس
      وضع القياس العادي اللي بنستخدمه فيه الخلية مع مقاومة خارجية حقيقية. كمان أي جهاز قياس حقيقي
      (زي الفولتميتر) بيسحب تيار صغير جدًا لكنه مش صفر بالظبط، فالقراءة عنده مش EMF نقية تمامًا.
      الأسهل والأدق إننا نقيس نقطتين حقيقيتين عند تيارين مختلفين (بمقاومات خارجية عادية)، ونستنتج
      الميل والتقاطع رياضيًا — وده بالظبط اللي معادلة الخط المستقيم بتسمح لنا بيه.
