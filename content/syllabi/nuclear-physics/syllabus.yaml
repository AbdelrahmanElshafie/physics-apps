# Nuclear physics learning path.
#
# Transcribed from Learning_Path_Checklist.md. Prerequisites form a DAG: topics chain
# within a module, and each module's first topic requires the previous module's
# checkpoint. Edit freely — `pnpm validate:content` checks the schema and the graph.

schemaVersion: 1
id: nuclear-physics
title: Nuclear Physics
subtitle: Nuclear reaction theory and TALYS calculations
description: >-
  A staged path from the mathematics of quantum mechanics through nuclear reaction
  theory to a publishable Th-232(n,gamma) cross-section calculation.
goal: Master nuclear reaction theory and TALYS calculations

