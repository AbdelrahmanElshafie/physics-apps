# تمارين الموضوع 11.1 — ليه النسبية مهمة للذرات.
#
# المجموعات من A لـ C حساب تقدر تعمله على الموبايل، لأن حجة الدرس كلها شايلاها كام رقم المفروض
# تبقى حافظهم. المجموعة D هي مكان التفكير، ودي بتيجي لي.
#
# الثوابت المستخدمة: alpha = 1/137.036، Ry = 109737.3 cm^-1، alpha^2 = 5.3251e-5.

schemaVersion: 1
topic: m11.1-why-relativity-matters-for-atoms
intro: >-
  أربعتاشر سؤال. لو عملت المجموعة A من غير ما تبص على حاجة، يبقى ماسك الحقيقة الوحيدة اللي
  الوحدة دي كلها مبنية عليها.

exercises:
  # ---- المجموعة A: السرعة وتكلفتها ----
  - id: rel1
    set: A
    label: س١
    kind: numeric
    prompt: >-
      $v/c$ بتساوي كام لإلكترون $1s$ في أيون موليبدنم شبيه الهيدروجين، $Z = 42$؟ اكتب أربع
      أرقام عشرية.
    check:
      type: numeric
      value: 0.3065
      tolerance: 0.002
    hint: المعادلة 11.1، بـ $n = 1$.
    solution: >-
      $v/c = Z\alpha/n = 42/137.036 = 0.3065$. أكتر من تلاتين في المية من سرعة الضوء بشوية، وده
      الرقم اللي باقي الوحدة بيرد عليه.

  - id: rel2
    set: A
    label: س٢
    kind: numeric
    prompt: >-
      معامل لورنتز $\gamma_L$ للإلكترون ده بيساوي كام؟ اكتب أربع أرقام عشرية.
    check:
      type: numeric
      value: 1.0506
      tolerance: 0.003
    solution: >-
      $\gamma_L = 1/\sqrt{1 - (0.3065)^2} = 1/\sqrt{0.9061} = 1.0506$. الإلكترون بيتصرف كإنه أتقل
      بخمسة في المية، والإلكترون الأتقل بيدور في مدار أضيق — ده الانكماش في جملة واحدة.

  - id: rel3
    set: A
    label: س٣
    kind: truefalse
    prompt: >-
      صح ولا غلط: إلكترون $1s$ في Mo XXXVI بيتحرك بأكتر من ربع سرعة الضوء.
    check: { type: exact, value: true }
    solution: >-
      صح. $0.3065 > 0.25$. تستاهل تتقال بصوت عالي مرة، لأنها من النوع اللي بيبان مبالغة لحد ما
      تعمل القسمة بنفسك.

  - id: rel4
    set: A
    label: س٤
    kind: numeric
    prompt: >-
      أصغر $Z$ عندها إلكترون $1s$ بيعدّي نص سرعة الضوء بتساوي كام؟
    check:
      type: numeric
      value: 69
      tolerance: 0.5
    hint: حلّ $Z\alpha > 0.5$.
    solution: >-
      $Z > 0.5 \times 137.036 = 68.5$، يعني $Z = 69$ — الثوليوم. فوق كده الإلكترون بقى أسرع من
      نص الضوء، وكلمة «تصحيح» نفسها بطّلت تكون أمينة.

  # ---- المجموعة B: أُس ديراك والمركبتين ----
  - id: rel5
    set: B
    label: س٥
    kind: numeric
    prompt: >-
      احسب أُس ديراك القطري $\gamma = \sqrt{1 - (Z\alpha)^2}$ للزركونيوم، $Z = 40$. أربع أرقام
      عشرية.
    check:
      type: numeric
      value: 0.9565
      tolerance: 0.001
    solution: >-
      $Z\alpha = 0.2919$، يعني $(Z\alpha)^2 = 0.0852$ و $\gamma = \sqrt{0.9148} = 0.9565$. خلي
      بالك إن $\gamma < 1$: الشكل النسبي $r^{\gamma}$ بيطلع أحدّ عند نقطة الأصل من اللا نسبي
      $r^{1}$.

  - id: rel6
    set: B
    label: س٦
    kind: numeric
    prompt: >-
      للموليبدنم، $Z = 42$، المركبة الصغيرة بتساوي كام في المية من الكبيرة؟ يعني احسب
      $100 \lvert Q/P \rvert$.
    check:
      type: numeric
      value: 15.7
      tolerance: 0.3
    hint: $\lvert Q/P \rvert = \sqrt{(1-\gamma)/(1+\gamma)}$، ومحتاج $\gamma$ الأول.
    solution: >-
      $\gamma = \sqrt{1 - 0.0939} = 0.9519$، يعني
      $\lvert Q/P \rvert = \sqrt{0.0481/1.9519} = \sqrt{0.0247} = 0.157$، أي $15.7\%$. مركبة
      «صغيرة» بتساوي سدس الكبيرة.

  - id: rel7
    set: B
    label: س٧
    kind: numeric
    prompt: >-
      احسب $\gamma$ لليورانيوم، $Z = 92$. أربع أرقام عشرية.
    check:
      type: numeric
      value: 0.7412
      tolerance: 0.001
    solution: >-
      $Z\alpha = 0.6713$، و $(Z\alpha)^2 = 0.4507$، و $\gamma = \sqrt{0.5493} = 0.7412$. الأُس
      ماشي ناحية مشكلة: عند $Z\alpha = 1$، حوالي $Z = 137$، $\gamma$ بيبقى تخيلي وحل ديراك
      للنواة النقطية بيبطل يكون موجود. حجم النواة المحدود هو اللي بينقذ الموقف، وعشان كده
      `rnucleus` بيشتغل قبل أي حاجة تانية.

  - id: rel8
    set: B
    label: س٨
    kind: latex
    prompt: >-
      اكتب أُس ديراك القطري $\gamma$ بدلالة $Z$ و $\alpha$.
    scaffold: \sqrt{}
    check:
      type: latex-equivalent
      value: '\sqrt{1-(Z\alpha)^2}'
      accept:
        - '\sqrt{1 - (Z\alpha)^{2}}'
        - '\sqrt{1-Z^2\alpha^2}'
        - '\sqrt{1 - Z^{2}\alpha^{2}}'
    solution: >-
      $\gamma = \sqrt{1 - (Z\alpha)^2}$. التعبير ده لوحده شايل الدرس كله: هو قوة $r$ جنب النواة،
      وهو اللي بيحدد نسبة الصغيرة للكبيرة، وهو المكان اللي النظرية بتنهار عنده عند $Z$ العالية.

  # ---- المجموعة C: البنية الدقيقة والأُس الرابع ----
  - id: rel9
    set: C
    label: س٩
    kind: numeric
    prompt: >-
      لما نروح من الكربون، $Z = 6$، للزركونيوم، $Z = 40$، انفصال البنية الدقيقة لـ $2p$ في أيون
      شبيه الهيدروجين بيكبر بمعامل قد إيه تقريباً؟
    check:
      type: numeric
      value: 1975
      tolerance: 80
    hint: الانفصال بيمشي كـ $Z^4$.
    solution: >-
      $(40/6)^4 = 6.667^4 \approx 1975$. تلات مراتب عشرية، بينما طاقات الربط — اللي بتمشي كـ
      $Z^2$ — بتكبر بـ $(40/6)^2 \approx 44$ بس.

  - id: rel10
    set: C
    label: س١٠
    kind: numeric
    prompt: >-
      باستخدام $\Delta E_{\text{fs}}(2p) = Z^4 \alpha^2 \mathrm{Ry}/16$ مع
      $\mathrm{Ry} = 109737.3\ \text{cm}^{-1}$ و $\alpha^2 = 5.3251 \times 10^{-5}$، احسب انفصال
      البنية الدقيقة لـ $2p$ في حديد شبيه الهيدروجين، $Z = 26$، بوحدة cm$^{-1}$.
    check:
      type: numeric
      value: 166900
      tolerance: 6000
    solution: >-
      $26^4 = 456976$. في $5.3251 \times 10^{-5}$ يدّي $24.34$؛ في $109737.3$ يدّي
      $2.671 \times 10^6$؛ على 16 يدّي $1.67 \times 10^5\ \text{cm}^{-1}$. قارن بـ
      $0.37\ \text{cm}^{-1}$ بتاعة الهيدروجين — نفس الفيزياء، وست مراتب عشرية فرق.

  - id: rel11
    set: C
    label: س١١
    kind: multichoice
    prompt: أنهي واحدة فيهم بتكبر أسرع مع زيادة $Z$؟
    choices:
      - { id: binding, label: طاقة ربط غلاف معيّن }
      - { id: coulomb, label: تنافر كولوم المتبقي بين إلكترونَي 2p }
      - { id: spinorbit, label: الانفصال المغزلي-المداري جوه غلاف 2p }
      - { id: radius, label: نصف قطر النواة }
    check: { type: exact, value: spinorbit }
    solution: >-
      المغزلي-المداري، بيمشي كـ $Z^4$. طاقة الربط بتمشي كـ $Z^2$، وتكامل كولوم المتبقي تقريباً
      كـ $Z$، ونصف قطر النواة كـ $A^{1/3}$ — اللي بالكاد بيتحرك. نسبة التالت للتاني، اللي بتمشي
      كـ $Z^3$، هي اللي بتقلب اقتران $LS$ لـ $jj$.

  # ---- المجموعة D: التفكير ----
  - id: rel12
    set: D
    label: س١٢
    kind: truefalse
    prompt: >-
      صح ولا غلط: بما إن $(Z\alpha)^2 \approx 0.09$ عند $Z = 42$ — أقل من عشرة في المية — يبقى
      ينفع نضيف الاقتران المغزلي-المداري كاضطراب على حسبة باقتران $LS$.
    check: { type: exact, value: false }
    explain:
      required: true
      hint: صغير بالنسبة لإيه بالظبط؟
    solution: >-
      غلط، والسبب أهم من الإجابة. كون $(Z\alpha)^2$ صغيرة بيقولك إن الحد النسبي صغير *بالنسبة
      لطاقة السكون*. نظرية الاضطراب محتاجاه صغير بالنسبة للمسافات بين الحالات اللي بيضطربها —
      والانفصال المغزلي-المداري في Zr XXXV أكبر من المسافات بين حدود $LS$ اللي المفروض يضطربها.
      لما التصحيح يبقى أكبر من البنية اللي بيصححها، يبقى هو اللي بيختار حالات الرتبة الصفرية، مش
      بيعدّلها.

  - id: rel13
    set: D
    label: س١٣
    kind: text
    prompt: >-
      اشرح بكلامك ليه نسبة الاقتران المغزلي-المداري لتنافر كولوم المتبقي بتمشي كـ $Z^3$، وده
      بيعمل إيه في نظام الاقتران.
    check: { type: tutor }
    solution: >-
      المغزلي-المداري بيمشي كـ $Z^4$ وتكامل كولوم المتبقي بيمشي تقريباً كـ $Z$، فالنسبة بتمشي كـ
      $Z^3$. عند $Z$ الصغيرة كولوم بيسيطر: $L$ و $S$ بيقترنوا الأول والمغزلي-المداري بيشقّ الحدود
      الناتجة — اقتران $LS$. عند $Z$ الكبيرة الترتيب بينقلب: كل إلكترون بيكوّن $j$ بتاعه، وبعدين
      الـ $j$ بيقترنوا في $J$ — اقتران $jj$. المسألة مش إن الإجابة بتتغير كام في المية؛ المسألة إن
      طقم أعداد كمية مختلف هو اللي بقى الصح.

  - id: rel14
    set: D
    label: س١٤
    kind: text
    prompt: >-
      النسبية بتكمّش مدارات $s$. طيب ليه مدارات $d$ و $f$ بتتمدد؟
    check: { type: tutor }
    explain:
      hint: مفيش حاجة بتأثر على مدار d مباشرة. اسأل نفسك إيه اللي اتغير في بيئته.
    solution: >-
      مدارات $d$ و $f$ الحاجز المركزي بيبعّدها عن النواة، فسعتها في المنطقة السريعة قليلة وبالكاد
      بتحس بأثر نسبي مباشر. اللي بيتغير بالنسبة لها هو الحجب: أغلفة $s$ و $p_{1/2}$ المنكمشة بقت
      أقرب وبتحجب شحنة النواة بكفاءة أعلى، فإلكترونات $d$ و $f$ بتشوف $Z$ فعّالة أصغر وبتبعد. ده
      الأثر النسبي غير المباشر، وهو المسؤول عن لون الدهب وسيولة الزئبق زي ما هو مسؤول عن ترتيب
      المستويات في الأيونات دي.
