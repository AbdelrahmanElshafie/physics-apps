# Exercises for Module 1.1 — Inner products.
#
# Several answers here are irrational or symbolic on purpose: they exercise the SymPy checker, so
# 1/sqrt(2) and sqrt(2)/2 both pass. Where an exact value is wanted the prompt says so.

schemaVersion: 1
topic: m1.1-inner-products
intro: >-
  Seventeen questions. Sets A and B are integrals you should be able to do in your head once the
  symmetry argument clicks; Set E walks the Gram-Schmidt construction that produces the Legendre
  polynomials.

exercises:
  # ---- Set A: Inner products of functions ----
  - id: i1
    set: A
    label: Q1
    kind: numeric
    prompt: >-
      With $f(x) = 1$ and $g(x) = x$ on $[-1, 1]$ and weight 1, compute $\braket{f}{g}$.
    check: { type: numeric, value: 0 }
    explain: { required: true, hint: "You should not need to integrate." }
    solution: >-
      Zero. The integrand $x$ is odd and the interval is symmetric about the origin, so the two
      halves cancel. The constant function and $x$ are orthogonal on $[-1,1]$.

  - id: i2
    set: A
    label: Q2
    kind: numeric
    prompt: With $f(x) = 1$ on $[-1, 1]$, compute $\braket{f}{f}$.
    check: { type: numeric, value: 2 }
    solution: $\int_{-1}^{1} 1 \, dx = 2$ — the length of the interval.

  - id: i3
    set: A
    label: Q3
    kind: numeric
    prompt: With $g(x) = x$ on $[-1, 1]$, compute $\braket{g}{g}$.
    check: { type: numeric, value: 0.6666666667, tolerance: 0.000001 }
    solution: $\int_{-1}^{1} x^2 \, dx = \left[\tfrac{x^3}{3}\right]_{-1}^{1} = \tfrac{2}{3}$.

  - id: i4
    set: A
    label: Q4
    kind: latex
    prompt: >-
      Normalise $f(x) = 1$ on $[-1, 1]$. Give the constant $c$ such that $c \cdot 1$ has norm one.
    check:
      type: symbolic
      value: \frac{1}{\sqrt{2}}
    solution: >-
      $c = 1/\sqrt{2}$, since $\lVert 1 \rVert = \sqrt{2}$. Writing it as $\sqrt{2}/2$ is the same
      number.

  - id: i5
    set: A
    label: Q5
    kind: truefalse
    prompt: >-
      True or false — if two functions are orthogonal on $[-1, 1]$, they are orthogonal on
      $[0, 1]$ as well.
    check: { type: exact, value: false }
    explain: { required: true, hint: "Try the pair from Q1." }
    solution: >-
      FALSE. Orthogonality depends on the interval. $1$ and $x$ are orthogonal on $[-1,1]$, but on
      $[0,1]$ the inner product is $\int_0^1 x \, dx = \tfrac{1}{2} \neq 0$. Changing the interval
      changes the space.

  # ---- Set B: Trigonometric orthogonality ----
  - id: i6
    set: B
    label: Q6
    kind: numeric
    prompt: Compute $\int_{-\pi}^{\pi} \sin x \cos x \, dx$.
    check: { type: numeric, value: 0 }
    solution: >-
      Zero. Either use $\sin x \cos x = \tfrac{1}{2}\sin 2x$ and integrate, or note the integrand
      is odd on a symmetric interval.

  - id: i7
    set: B
    label: Q7
    kind: truefalse
    prompt: True or false — $\sin x$ and $\sin 2x$ are orthogonal on $[-\pi, \pi]$.
    check: { type: exact, value: true }
    explain: { required: true }
    solution: >-
      TRUE. $\int_{-\pi}^{\pi} \sin x \sin 2x \, dx = 0$. Distinct Fourier modes are mutually
      orthogonal, which is precisely what lets each coefficient be extracted independently.

  - id: i8
    set: B
    label: Q8
    kind: latex
    prompt: Compute $\int_{-\pi}^{\pi} \sin^2 x \, dx$. Give the exact value.
    check:
      type: symbolic
      value: \pi
    solution: >-
      $\pi$. Use $\sin^2 x = \tfrac{1}{2}(1 - \cos 2x)$: the constant half integrates to $\pi$ and
      the cosine term integrates to zero over a whole number of periods.

  - id: i9
    set: B
    label: Q9
    kind: text
    prompt: >-
      Why does the orthogonality of the trigonometric functions make a Fourier series usable at all?
    explain: { required: true }
    check: { type: tutor }
    solution: >-
      Because each coefficient can be extracted with a single integral: taking the inner product
      with one mode annihilates every other term. Without orthogonality you would face an infinite
      system of coupled equations instead of one integral per coefficient.

  # ---- Set C: Weight functions ----
  - id: i10
    set: C
    label: Q10
    kind: text
    prompt: What condition must a weight function $w(x)$ satisfy, and why?
    explain: { required: true }
    check: { type: tutor }
    solution: >-
      It must be positive on the interval. If $w$ went negative somewhere, $\braket{f}{f}_w$ could
      come out zero or negative for a non-zero $f$, breaking the positivity axiom — and with it the
      notion of length.

  - id: i11
    set: C
    label: Q11
    kind: text
    prompt: >-
      Legendre polynomials are orthogonal on $[-1,1]$ with weight 1; Hermite polynomials on the
      whole real line with weight $e^{-x^2}$. Why would a family need a weight at all?
    explain: { required: true }
    check: { type: tutor }
    solution: >-
      Because the interval alone may not make the relevant differential operator self-adjoint. The
      weight is the factor that does, and self-adjoint operators have orthogonal eigenfunctions.
      Over an infinite interval it also supplies the decay that makes the integrals converge.

  # ---- Set D: Continuous bases ----
  - id: i12
    set: D
    label: Q12
    kind: latex
    prompt: Write the orthonormality condition for the continuous position basis.
    check:
      type: latex-equivalent
      value: \braket{x}{x'} = \delta(x - x')
      accept:
        - '\langle x \vert x'' \rangle = \delta(x - x'')'
        - '\braket{x}{x''} = \delta(x-x'')'
    solution: >-
      $\braket{x}{x'} = \delta(x - x')$. The Kronecker delta of the discrete case becomes a Dirac
      delta when the index is continuous.

  - id: i13
    set: D
    label: Q13
    kind: latex
    prompt: Write the completeness relation for the position basis.
    check:
      type: latex-equivalent
      value: \int \ket{x}\bra{x} \dd x = \mathbb{1}
      accept:
        - '\int \lvert x \rangle \langle x \rvert dx = 1'
        - '\int \ket{x}\bra{x} dx = 1'
        - '\int \ket{x}\bra{x} \, dx = \mathbb{1}'
    solution: >-
      $\int \ket{x}\bra{x}\,dx = \mathbb{1}$ — the discrete sum over basis projectors becomes an
      integral.

  - id: i14
    set: D
    label: Q14
    kind: text
    prompt: >-
      Starting from $\braket{\phi}{\psi}$, insert the position identity and show you recover
      $\int \phi^{*}(x)\psi(x)\,dx$.
    explain: { required: true }
    check: { type: tutor }
    solution: >-
      $\braket{\phi}{\psi} = \bra{\phi}\left(\int \ket{x}\bra{x}dx\right)\ket{\psi} = \int
      \braket{\phi}{x}\braket{x}{\psi}\,dx = \int \phi^{*}(x)\psi(x)\,dx$. The conjugate appears
      because $\braket{\phi}{x} = \braket{x}{\phi}^{*}$.

  # ---- Set E: Gram-Schmidt ----
  - id: i15
    set: E
    label: Q15
    kind: numeric
    prompt: >-
      Gram-Schmidt on $\{1, x, x^2\}$ over $[-1,1]$. With $e_1 = 1/\sqrt{2}$, compute
      $\braket{e_1}{x}$.
    check: { type: numeric, value: 0 }
    solution: >-
      Zero — the integrand is odd on a symmetric interval. So $x$ needs no correction; it is
      already orthogonal to the constant.

  - id: i16
    set: E
    label: Q16
    kind: latex
    prompt: >-
      Continuing, subtract from $x^2$ its projection onto $e_1$ (the projection onto $e_2$
      vanishes). What is the resulting $u_3$?
    check:
      type: symbolic
      value: x^2 - \frac{1}{3}
    explain: { required: true, hint: "Which standard polynomial is this proportional to?" }
    solution: >-
      $u_3 = x^2 - \tfrac{1}{3}$. Since $P_2(x) = \tfrac{1}{2}(3x^2-1) = \tfrac{3}{2}(x^2 -
      \tfrac{1}{3})$, this is the second Legendre polynomial up to a constant — orthogonalising the
      powers of $x$ on $[-1,1]$ produces the Legendre family.

  - id: i17
    set: E
    label: Q17
    kind: text
    prompt: >-
      Truncating an expansion after $N$ terms gives the best approximation available in that
      subspace. Why is the leftover error orthogonal to everything you kept, and why does that
      matter for a partial-wave sum?
    explain: { required: true }
    check: { type: tutor }
    solution: >-
      Because each retained coefficient already removed the entire component along its basis
      vector, so nothing of those directions survives in the remainder. It matters because the
      discarded high-$l$ terms are orthogonal to the retained ones: truncating cannot corrupt the
      terms you kept, only omit what was left out — which is what makes it a controlled
      approximation.
