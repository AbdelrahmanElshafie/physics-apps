# Exercises for Module 1.1 — Eigenvalue problems.
#
# Set B is a full eigenvalue calculation broken into steps, so a slip in the characteristic
# polynomial is caught before it propagates into the eigenvectors.

schemaVersion: 1
topic: m1.1-eigenvalue-problems
intro: >-
  Seventeen questions. Work Set B in order — it is one calculation split across five questions,
  and each step feeds the next. Set D is the trace-and-determinant check you should run on every
  eigenvalue problem you ever do.

exercises:
  # ---- Set A: The definition ----
  - id: e1
    set: A
    label: Q1
    kind: truefalse
    prompt: >-
      True or false — $(1, 1)$ is an eigenvector of
      $\sigma_x = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$.
    check: { type: exact, value: true }
    explain: { required: true, hint: "Apply the matrix and compare with the original." }
    solution: >-
      TRUE. $\sigma_x(1,1) = (1,1)$, which is $1 \times (1,1)$ — the same direction, rescaled by
      $\lambda = 1$.

  - id: e2
    set: A
    label: Q2
    kind: numeric
    prompt: What is the eigenvalue belonging to that eigenvector?
    check: { type: numeric, value: 1 }
    solution: $\lambda = 1$. The operator returned the vector unchanged.

  - id: e3
    set: A
    label: Q3
    kind: numeric
    prompt: >-
      Apply $\sigma_x$ to $(1, -1)$ and read off the eigenvalue.
    check: { type: numeric, value: -1 }
    solution: >-
      $\sigma_x(1,-1) = (-1, 1) = -1 \times (1,-1)$, so $\lambda = -1$. Same line, reversed
      direction.

  - id: e4
    set: A
    label: Q4
    kind: truefalse
    prompt: >-
      True or false — if $\ket{\psi}$ is an eigenvector with eigenvalue $\lambda$, then
      $5\ket{\psi}$ is an eigenvector with eigenvalue $5\lambda$.
    check: { type: exact, value: false }
    explain: { required: true }
    solution: >-
      FALSE. $5\ket{\psi}$ is still an eigenvector, but with the **same** eigenvalue $\lambda$:
      $\hat{A}(5\ket{\psi}) = 5\hat{A}\ket{\psi} = 5\lambda\ket{\psi} = \lambda(5\ket{\psi})$. An
      eigenvector is a direction; rescaling it does not change the factor.

  # ---- Set B: A full calculation ----
  - id: e5
    set: B
    label: Q5
    kind: latex
    prompt: >-
      For $A = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}$, write the characteristic polynomial
      $\det(A - \lambda\mathbb{1})$ in terms of $\lambda$.
    check:
      type: symbolic
      value: (2-\lambda)^2 - 1
    explain: { required: true, hint: "Expand it if you like — either form is accepted." }
    solution: >-
      $(2-\lambda)^2 - 1 = \lambda^2 - 4\lambda + 3$. Subtract $\lambda$ from each diagonal entry,
      then take the determinant.

  - id: e6
    set: B
    label: Q6
    kind: numeric
    prompt: Solve it. What is the larger of the two eigenvalues?
    check: { type: numeric, value: 3 }
    solution: >-
      $\lambda^2 - 4\lambda + 3 = (\lambda-1)(\lambda-3) = 0$, so $\lambda = 1$ or $3$. The larger
      is $3$.

  - id: e7
    set: B
    label: Q7
    kind: numeric
    prompt: And the smaller?
    check: { type: numeric, value: 1 }
    solution: $\lambda = 1$.

  - id: e8
    set: B
    label: Q8
    kind: vector
    prompt: >-
      Find an eigenvector for $\lambda = 3$. Give any non-zero vector on that line — normalisation
      is not needed.
    scaffold: (,)
    check:
      # Any non-zero multiple is the same eigenvector, and the prompt says so.
      type: parallel
      value: [1, 1]
    explain: { required: true, hint: "Substitute and solve the resulting row." }
    solution: >-
      Substituting gives $\begin{pmatrix} -1 & 1 \\ 1 & -1 \end{pmatrix}v = 0$, so $v_2 = v_1$ and
      $(1,1)$ works. Any multiple of it is equally valid.

  - id: e9
    set: B
    label: Q9
    kind: vector
    prompt: Now find an eigenvector for $\lambda = 1$. Again, any vector on that line will do.
    scaffold: (,)
    check:
      type: parallel
      value: [1, -1]
    solution: >-
      $\begin{pmatrix} 1 & 1 \\ 1 & 1 \end{pmatrix}v = 0$ gives $v_2 = -v_1$, so $(1,-1)$. Note it
      is orthogonal to the other eigenvector — that is not an accident, and the next lesson
      explains why.

  # ---- Set C: Degeneracy and existence ----
  - id: e10
    set: C
    label: Q10
    kind: text
    prompt: >-
      Every vector is an eigenvector of the identity operator. What is the eigenvalue, and what
      does that say about which basis diagonalises it?
    explain: { required: true }
    check: { type: tutor }
    solution: >-
      The eigenvalue is 1, with the whole space as its eigenspace — maximal degeneracy. Every basis
      diagonalises the identity, since it is already diagonal in all of them.

  - id: e11
    set: C
    label: Q11
    kind: text
    prompt: >-
      A nuclear level with angular momentum $j$ is $(2j+1)$-fold degenerate. In eigenvalue terms,
      what does that mean, and what freedom does it give you?
    explain: { required: true }
    check: { type: tutor }
    solution: >-
      The energy eigenvalue is repeated $(2j+1)$ times, so its eigenspace is $(2j+1)$-dimensional
      rather than a single direction. You are free to pick any orthonormal basis inside that
      subspace — usually one chosen to diagonalise another operator too, such as $J_z$.

  - id: e12
    set: C
    label: Q12
    kind: truefalse
    prompt: >-
      True or false — a real matrix always has real eigenvalues.
    check: { type: exact, value: false }
    explain: { required: true, hint: "Think about a rotation." }
    solution: >-
      FALSE. The rotation $\begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$ has characteristic
      polynomial $\lambda^2 + 1$, so $\lambda = \pm i$. It rotates every direction, so no real
      eigenvector exists. This is exactly why observables must be restricted to Hermitian operators.

  # ---- Set D: Invariants as a check ----
  - id: e13
    set: D
    label: Q13
    kind: numeric
    prompt: >-
      For $A = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}$, compute the trace directly from the
      matrix.
    check: { type: numeric, value: 4 }
    solution: $2 + 2 = 4$.

  - id: e14
    set: D
    label: Q14
    kind: numeric
    prompt: Now add your two eigenvalues from Set B. Do they agree?
    check: { type: numeric, value: 4 }
    explain: { required: true }
    solution: >-
      $3 + 1 = 4$, matching the trace. The trace always equals the sum of the eigenvalues, which
      makes it a free check on your arithmetic.

  - id: e15
    set: D
    label: Q15
    kind: numeric
    prompt: Compute $\det A$ for that same matrix, and check it against the product of eigenvalues.
    check: { type: numeric, value: 3 }
    solution: $\det A = (2)(2) - (1)(1) = 3$, and $3 \times 1 = 3$. Both agree.

  # ---- Set E: Why it matters ----
  - id: e16
    set: E
    label: Q16
    kind: text
    prompt: >-
      Why is working in the eigenbasis such a large practical win when solving coupled equations?
    explain: { required: true }
    check: { type: tutor }
    solution: >-
      Because in that basis the operator is diagonal, so it does not mix components. A coupled
      system becomes a set of independent one-dimensional problems, each solvable on its own. That
      is precisely how a coupled-channels calculation is made tractable.

  - id: e17
    set: E
    label: Q17
    kind: text
    prompt: >-
      In quantum mechanics, what do the eigenvalues and eigenvectors of an observable represent?
    explain: { required: true }
    check: { type: tutor }
    solution: >-
      The eigenvalues are the possible results of measuring that observable; the corresponding
      eigenvector is the state the system is left in after that result is obtained. The probability
      of the result is $|\braket{a}{\psi}|^2$. For the Hamiltonian the eigenvalues are the allowed
      energies and the eigenvectors the stationary states.
